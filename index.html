<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interview AI | Mock Interview Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>:root{
  --bg:#e8effb; --ink:#0f1b3d; --muted:#6c7a99; --blue:#2563eb; --blue-d:#1d4fd8; --blue-l:#e4ecff; --blue-xl:#f1f5ff;
  --card:#fff; --line:#e3eaf7; --navy:#0e1a3a; --good:#16a34a; --warn:#f59e0b; --bad:#e5484d;
  --cyan:#58d9f8; --black:#1b1b1d;
  --sans:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif; --serif:'Instrument Serif',Georgia,serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--sans);color:var(--ink);background:radial-gradient(1200px 700px at 15% -10%,#f6f9ff 0,transparent 60%),radial-gradient(900px 600px at 100% 100%,#dde8fb 0,transparent 55%),var(--bg);min-height:100vh;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
.ic{width:20px;height:20px;flex:none}
[hidden]{display:none!important}

/* ---------- shell ---------- */
.shell{max-width:1320px;margin:28px auto;background:rgba(255,255,255,.82);border-radius:38px;box-shadow:0 30px 80px -30px rgba(37,70,150,.25),0 0 0 1px rgba(255,255,255,.9) inset;display:grid;grid-template-columns:96px 1fr;overflow:hidden;min-height:calc(100vh - 56px)}
.rail{border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:34px 0 28px;gap:10px;background:rgba(255,255,255,.6)}
.logo{width:44px;height:44px;margin-bottom:26px}
.rail-btn{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;color:#5f78b4;transition:.2s;position:relative}
.rail-btn:hover:not(:disabled){background:var(--blue-l);color:var(--blue)}
.rail-btn.active{background:var(--blue);color:#fff;box-shadow:0 12px 24px -8px rgba(37,99,235,.55)}
.rail-btn:disabled{opacity:.35;cursor:not-allowed}
.rail-btn .dot{position:absolute;top:12px;right:12px;width:9px;height:9px;border-radius:50%;background:#ef4444;border:2px solid #fff}
.rail .spacer{flex:1}
.avatar{width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,#60a5fa,#2563eb);color:#fff;font-weight:600;display:grid;place-items:center;position:relative;font-size:18px;border:3px solid #fff;box-shadow:0 0 0 1px var(--line)}
.avatar::after{content:'';position:absolute;right:-1px;bottom:0;width:13px;height:13px;border-radius:50%;background:#22c55e;border:2px solid #fff}

.views{min-width:0}
.view{display:grid;grid-template-columns:minmax(0,1fr) 360px;min-height:100%}
.col-main{padding:36px 40px 40px;min-width:0}
.col-side{border-left:1px solid var(--line);padding:30px 28px 32px;background:linear-gradient(180deg,rgba(247,250,255,.9),rgba(255,255,255,.4));display:flex;flex-direction:column;gap:20px;min-width:0}
.head h1{font-size:32px;font-weight:600;letter-spacing:-.02em}
.head p{color:var(--muted);font-size:15px;margin-top:4px}
.sec{font-size:19px;font-weight:600;margin:30px 0 14px;display:flex;justify-content:space-between;align-items:baseline}
.sec a,.link{font-size:13px;color:var(--blue);text-decoration:underline;font-weight:500;cursor:pointer}
.side-top{display:flex;gap:12px;align-items:center}
.pill{flex:1;display:flex;align-items:center;gap:10px;background:var(--blue-l);border-radius:999px;padding:0 18px;height:46px;color:#5f78b4;font-size:14px;min-width:0;white-space:nowrap}
.pill b{color:var(--ink);font-weight:600}
.pill .ic{width:18px;height:18px}
.circle{width:52px;height:52px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;flex:none;box-shadow:0 10px 22px -8px rgba(37,99,235,.6);transition:.2s}
.circle:hover{background:var(--blue-d);transform:translateY(-1px)}

.card{background:var(--card);border-radius:26px;border:1px solid var(--line);padding:22px 24px;box-shadow:0 8px 24px -16px rgba(37,70,150,.25)}
.card h3{font-size:16px;font-weight:600;margin-bottom:4px}
.card .sub{color:var(--muted);font-size:13px}

/* ---------- setup ---------- */
.role-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.role-tile{text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:22px;padding:16px 18px;display:flex;flex-direction:column;gap:6px;transition:.2s;position:relative}
.role-tile:hover{border-color:#b9cdf7;transform:translateY(-2px);box-shadow:0 14px 28px -18px rgba(37,99,235,.5)}
.role-tile.active{border-color:var(--blue);background:var(--blue-xl);box-shadow:0 14px 28px -16px rgba(37,99,235,.55)}
.role-tile .ri{width:40px;height:40px;border-radius:14px;background:var(--blue-l);color:var(--blue);display:grid;place-items:center;margin-bottom:4px}
.role-tile.active .ri{background:var(--blue);color:#fff}
.role-tile b{font-weight:600;font-size:15px}
.role-tile span{color:var(--muted);font-size:12.5px;line-height:1.4}
.role-tile .tick{position:absolute;top:14px;right:14px;width:22px;height:22px;border-radius:50%;background:var(--blue);color:#fff;display:none;place-items:center}
.role-tile.active .tick{display:grid}
.role-tile .tick .ic{width:13px;height:13px;stroke-width:3}
.field{display:flex;flex-direction:column;gap:7px;margin-top:14px}
.field label{font-size:13px;font-weight:600;color:#3b4a6e}
.input{height:48px;border-radius:16px;border:1.5px solid var(--line);padding:0 16px;background:#fff;outline:none;transition:.2s;width:100%}
.input:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(37,99,235,.12)}
.level-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.level-tile{background:#fff;border:1.5px solid var(--line);border-radius:20px;padding:16px;text-align:left;transition:.2s;display:flex;flex-direction:column;gap:4px}
.level-tile:hover{border-color:#b9cdf7}
.level-tile.active{border-color:var(--blue);background:var(--blue-xl)}
.level-tile .bars{display:flex;gap:3px;margin-bottom:8px}
.level-tile .bars i{width:16px;height:5px;border-radius:3px;background:#d5e1fa}
.level-tile.active .bars i.on{background:var(--blue)}
.level-tile .bars i.on{background:#8fb0f3}
.level-tile b{font-size:15px;font-weight:600}
.level-tile span{font-size:12px;color:var(--muted);line-height:1.35}
.set-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:4px}
.seg{display:flex;background:var(--blue-l);border-radius:16px;padding:4px;gap:4px}
.seg button{flex:1;height:40px;border-radius:12px;font-weight:500;font-size:14px;color:#5f78b4;transition:.2s}
.seg button.on{background:#fff;color:var(--blue);box-shadow:0 4px 12px -6px rgba(37,99,235,.5);font-weight:600}
.toggles{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.tog{display:flex;align-items:center;justify-content:space-between;gap:14px;font-size:14px;padding:12px 16px;border-radius:16px;background:var(--blue-xl);cursor:pointer}
.tog small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.sw{width:46px;height:27px;border-radius:999px;background:#c9d6f2;position:relative;transition:.2s;flex:none}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.tog.on .sw{background:var(--blue)}
.tog.on .sw::after{left:22px}
.btn{height:54px;border-radius:999px;padding:0 30px;font-weight:600;font-size:15.5px;display:inline-flex;align-items:center;gap:10px;justify-content:center;transition:.2s}
.btn.primary{background:var(--blue);color:#fff;box-shadow:0 16px 30px -12px rgba(37,99,235,.7)}
.btn.primary:hover:not(:disabled){background:var(--blue-d);transform:translateY(-2px)}
.btn.primary:disabled{background:#a9bdea;box-shadow:none;cursor:not-allowed}
.btn.ghost{background:var(--blue-l);color:var(--blue)}
.btn.ghost:hover{background:#d5e2ff}
.btn.danger{background:#fdeceb;color:var(--bad)}
.btn.sm{height:44px;padding:0 20px;font-size:14px}
.start-row{display:flex;align-items:center;gap:20px;margin-top:30px;flex-wrap:wrap}
.start-row small{color:var(--muted);font-size:13px}

.devcheck video{width:100%;aspect-ratio:16/10;border-radius:20px;background:linear-gradient(135deg,#cfe0ff,#e9f1ff);object-fit:cover;transform:scaleX(-1);display:block}
.devcheck .meter{height:8px;background:var(--blue-l);border-radius:99px;overflow:hidden;margin:14px 0 4px}
.devcheck .meter i{display:block;height:100%;width:0;background:var(--blue);border-radius:99px;transition:width .08s}
.steps{display:flex;flex-direction:column;gap:10px}
.step{display:flex;gap:12px;align-items:flex-start;font-size:13.5px;color:#3b4a6e;line-height:1.45}
.step i{font-style:normal;width:26px;height:26px;border-radius:50%;background:var(--blue-l);color:var(--blue);display:grid;place-items:center;font-weight:600;font-size:13px;flex:none}
.tip-card{border-radius:30px;background:linear-gradient(160deg,#e6eeff,#dbe7ff);padding:24px;position:relative;overflow:hidden}
.tip-card h3{font-family:var(--serif);font-weight:400;font-size:30px;letter-spacing:-.01em;margin-bottom:6px}
.tip-card p{font-size:13.5px;line-height:1.5;color:#3b4a6e;max-width:165px}
.tip-card .art{position:absolute;right:14px;bottom:50px;width:96px;opacity:.95}
.tip-card .btn{margin-top:16px}

/* ---------- interview ---------- */
.stage{display:flex;flex-direction:column;gap:14px;margin-top:22px}
.stage:fullscreen{background:var(--bg);padding:24px;justify-content:center}
.qcard{background:#fff;border:1px solid var(--line);border-radius:26px;padding:20px 26px 22px;box-shadow:0 10px 28px -20px rgba(37,70,150,.4)}
.q-meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12.5px}
.q-meta .tag{background:var(--blue-l);color:var(--blue);border-radius:99px;padding:5px 12px;font-weight:600}
.q-meta .tag.alt{background:#f1f3f9;color:#5d6b8b}
.q-meta .speaking{margin-left:auto;color:var(--blue);display:flex;align-items:center;gap:8px;font-weight:500;opacity:0;transition:.3s}
.q-meta .speaking.on{opacity:1}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:14px}
.eq i{width:3px;background:var(--blue);border-radius:2px;animation:eq 0.9s infinite ease-in-out}
.eq i:nth-child(2){animation-delay:.15s}.eq i:nth-child(3){animation-delay:.3s}.eq i:nth-child(4){animation-delay:.45s}
@keyframes eq{0%,100%{height:4px}50%{height:14px}}
.q-text{font-size:23px;line-height:1.35;font-weight:600;letter-spacing:-.015em;margin-top:12px}
.video{position:relative;border-radius:30px;overflow:hidden;aspect-ratio:16/9;max-height:400px;width:100%;background:linear-gradient(135deg,#bcd3fb,#e6eefc 60%,#d4e3ff);box-shadow:0 24px 50px -30px rgba(37,70,150,.55)}
.video video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);display:none}
.video.cam-on video{display:block}
.cam-off{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:12px;color:#51689d}
.video.cam-on .cam-off{display:none}
.cam-off .big{width:112px;height:112px;border-radius:50%;background:linear-gradient(135deg,#60a5fa,#2563eb);color:#fff;font-size:46px;font-weight:600;display:grid;place-items:center;box-shadow:0 20px 40px -16px rgba(37,99,235,.7)}
.cam-off span{font-size:14px}
.live{position:absolute;top:18px;left:18px;background:var(--navy);color:#fff;border-radius:99px;padding:9px 16px;display:flex;align-items:center;gap:9px;font-size:14px;font-weight:500}
.live i{width:9px;height:9px;border-radius:50%;background:#ff3b3b;animation:blink 1.3s infinite}
@keyframes blink{50%{opacity:.35}}
.fs{position:absolute;top:18px;right:18px;width:46px;height:46px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center}
.vol{position:absolute;right:18px;bottom:24px;display:flex;flex-direction:column;align-items:center;gap:10px}
.vol-track{width:16px;height:128px;border-radius:99px;background:var(--navy);position:relative;overflow:hidden}
.vol-fill{position:absolute;left:3px;right:3px;bottom:3px;height:4%;border-radius:99px;background:linear-gradient(180deg,#60a5fa,#2563eb);transition:height .07s}
.vol-btn{width:46px;height:46px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center}
.vol-btn.off{color:#7c8bb0}
.controls{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);display:flex;gap:8px;background:rgba(14,26,58,.94);padding:8px;border-radius:99px;backdrop-filter:blur(10px)}
.cbtn{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:#fff;background:rgba(255,255,255,.1);transition:.2s}
.cbtn:hover{background:rgba(255,255,255,.2)}
.cbtn.off{background:rgba(255,255,255,.06);color:#8da0cf}
.cbtn.end{background:var(--bad)}
.cbtn.end .ic{transform:rotate(135deg)}
.chip-status{position:absolute;left:18px;bottom:24px;background:rgba(255,255,255,.92);border-radius:99px;padding:9px 16px;font-size:13px;font-weight:500;display:flex;align-items:center;gap:9px;color:var(--ink);box-shadow:0 8px 20px -10px rgba(0,0,0,.3)}
.chip-status i{width:9px;height:9px;border-radius:50%;background:#94a3c8}
.chip-status.listen i{background:var(--bad);animation:blink 1s infinite}
.chip-status.review i{background:var(--good)}
.actions{display:flex;gap:12px;justify-content:flex-end;align-items:center;margin-top:16px;flex-wrap:wrap}
.actions .grow{flex:1;color:var(--muted);font-size:13.5px;min-width:160px}
.tiles{display:flex;gap:12px;margin-top:6px}
.tile{flex:1;min-width:0;background:#fff;border:1px solid var(--line);border-radius:22px;padding:14px 8px 12px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12.5px;transition:.2s}
.tile .tc{width:52px;height:52px;border-radius:50%;background:var(--blue-l);display:grid;place-items:center;color:var(--blue);font-weight:600;font-size:15px}
.tile.cur{background:var(--blue-l);border-color:#c7d8fb}
.tile.cur .tc{background:var(--blue);color:#fff;box-shadow:0 8px 18px -6px rgba(37,99,235,.7)}
.tile.done .tc{background:#e4f7ec;color:var(--good)}
.tile .nm{display:flex;align-items:center;gap:6px;color:#3b4a6e;font-weight:500;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .nm i{width:8px;height:8px;border-radius:50%;background:var(--blue);flex:none}
.tile.done .nm i{background:var(--good)}
.tile.pend .nm i{background:#c3cde6}
.tile.more{background:var(--blue-l);justify-content:center;font-size:22px;color:var(--blue);font-weight:500}
.tile.ai .tc{background:linear-gradient(135deg,#1e3a8a,#2563eb);color:#fff}
.tile.ai.speak .tc{animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(37,99,235,.5)}100%{box-shadow:0 0 0 14px rgba(37,99,235,0)}}
.ins{display:flex;flex-direction:column;gap:12px}
.ins-row{background:#fff;border:1px solid var(--line);border-radius:22px;padding:14px 20px;display:grid;grid-template-columns:44px minmax(150px,1.3fr) 110px 110px minmax(90px,.9fr);gap:16px;align-items:center;font-size:13px;color:var(--muted)}
.ins-row .ii{width:44px;height:44px;border-radius:50%;background:var(--blue-l);color:var(--blue);display:grid;place-items:center}
.ins-row b{display:block;color:var(--ink);font-size:14.5px;font-weight:600}
.ins-row .sm{display:flex;align-items:center;gap:6px;margin-top:3px;font-size:12.5px}
.ins-row em{font-style:normal;color:var(--ink);font-weight:600;margin-left:6px}
.ins-row .col{border-left:1px solid var(--line);padding-left:16px}
.bar{height:8px;border-radius:99px;background:#e6edfb;overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue);border-radius:99px;transition:width .3s}
.bar.warn i{background:var(--warn)}.bar.bad i{background:var(--bad)}.bar.good i{background:var(--good)}

.side-head{display:flex;justify-content:space-between;align-items:baseline;margin-top:4px}
.side-head h3{font-size:19px;font-weight:600}
.chat{flex:1;display:flex;flex-direction:column;gap:12px;overflow-y:auto;min-height:260px;max-height:430px;padding-right:4px}
.msg{display:flex;gap:10px;align-items:flex-start;animation:rise .35s both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
.msg .av{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#1e3a8a,#2563eb);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:600;flex:none}
.msg .bub{background:#f1f5fc;border-radius:18px;border-top-left-radius:6px;padding:11px 14px;font-size:13.5px;line-height:1.5;max-width:100%;min-width:0}
.msg .bub .who{display:flex;justify-content:space-between;gap:16px;font-size:12px;margin-bottom:3px}
.msg .bub .who b{font-weight:600}.msg .bub .who span{color:#98a5c3}
.msg.me{justify-content:flex-end}
.msg.me .bub{background:var(--blue);color:#fff;border-radius:18px;border-top-right-radius:6px}
.msg.me .bub .who span{color:#cfe0ff}
.msg.me .bub.live{background:#7fa1ee}
.msg.me .bub.live::after{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:#fff;margin-left:6px;animation:blink 1s infinite}
.msg .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.msg .chips span{background:#fff;border-radius:99px;padding:3px 10px;font-size:12px;font-weight:600;color:var(--ink)}
.msg .chips span.big{background:var(--blue);color:#fff}
.msg .bub ul{margin:6px 0 0;padding-left:16px;color:#3b4a6e}
.composer{display:flex;gap:8px}
.composer input{flex:1;height:50px;border-radius:99px;border:1.5px solid var(--line);padding:0 20px;outline:none;background:#fff;font-size:13.5px;min-width:0}
.composer input:focus{border-color:var(--blue)}
.composer button{width:50px;height:50px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;flex:none}
.empty{border:1.5px dashed #c7d6f5;border-radius:26px;padding:40px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:14px;align-items:center}

/* history / settings / lab */
.hist{display:flex;flex-direction:column;gap:12px}
.hist-item{display:grid;grid-template-columns:64px 1fr auto;gap:18px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:24px;padding:14px 20px;text-align:left;transition:.2s}
.hist-item:hover{border-color:#b9cdf7;transform:translateY(-2px);box-shadow:0 16px 30px -22px rgba(37,99,235,.6)}
.score-ring{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:18px;background:conic-gradient(var(--blue) calc(var(--p)*1%),#e4ecff 0)}
.score-ring span{width:48px;height:48px;border-radius:50%;background:#fff;display:grid;place-items:center}
.hist-item b{font-size:15.5px;font-weight:600}
.hist-item small{color:var(--muted);display:block;margin-top:3px;font-size:12.5px}
.mini-dims{display:flex;gap:6px}
.mini-dims span{font-size:12px;background:var(--blue-xl);border-radius:99px;padding:5px 10px;color:#3b4a6e}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kv .card{padding:16px 18px;border-radius:22px}
.kv .n{font-size:30px;font-weight:300;letter-spacing:-.02em}
.kv .l{font-size:12.5px;color:var(--muted)}
.lab-svg{width:100%;height:auto;display:block}
.lab-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px}
.lab-stats div{background:var(--blue-xl);border-radius:18px;padding:12px 14px}
.lab-stats b{display:block;font-size:20px;font-weight:600}
.lab-stats span{font-size:12px;color:var(--muted)}
.note{background:#fff8e6;border:1px solid #fde7aa;border-radius:18px;padding:14px 16px;font-size:13px;line-height:1.55;color:#6b5314;margin-top:16px}
.slider-row{display:grid;grid-template-columns:1fr 46px;gap:6px 10px;font-size:12.5px;align-items:center}
.slider-row label{color:#3b4a6e;font-weight:500}
.slider-row input[type=range]{grid-column:1/3;width:100%;accent-color:var(--blue);margin:0}
.slider-row output{text-align:right;color:var(--muted)}
.out-row{display:grid;grid-template-columns:76px 1fr 34px;gap:10px;align-items:center;font-size:13px;margin:8px 0}

<script>/* Question bank. t = tier: 0 Fresher, 1 Intern, 2 Intermediate, 3 Advanced.
   kw   = expected concepts. "a|b" means a or b counts as a hit (prefix match).
   model = reference answer used for similarity and shown after the interview. */
(function () {
  const NS = (globalThis.IAI = globalThis.IAI || {});

  const LEVELS = [
    { key: 0, name: 'Fresher', sub: '0 to 1 years', blurb: 'Fundamentals and clear explanations' },
    { key: 1, name: 'Intern', sub: 'Projects and internships', blurb: 'Basics plus hands-on thinking' },
    { key: 2, name: 'Intermediate', sub: '1 to 3 years', blurb: 'Design choices and trade-offs' },
    { key: 3, name: 'Advanced', sub: '3+ years', blurb: 'Systems, scale and leadership' },
  ];

  const ROLES = {
    ai: { title: 'AI Engineer', icon: 'spark', blurb: 'LLMs, RAG, agents, prompt design' },
    ml: { title: 'ML Engineer', icon: 'network', blurb: 'Models, training, evaluation, MLOps' },
    py: { title: 'Python Developer', icon: 'code', blurb: 'Core Python, OOP, performance' },
    be: { title: 'Backend Developer', icon: 'server', blurb: 'APIs, databases, scaling, auth' },
    fe: { title: 'Frontend Developer', icon: 'layout', blurb: 'JavaScript, React, CSS, speed' },
    fde: { title: 'FDE', full: 'Forward Deployed Engineer', icon: 'plug', blurb: 'Build and ship solutions at customer sites' },
    other: { title: 'Other role', icon: 'plus', blurb: 'Type any role, get core engineering questions' },
  };

  const Q = (t, q, kw, model, hint) => ({ t, q, kw, model, hint, type: 'tech' });

  const BANK = {
    ai: [
      Q(0, 'What is the difference between AI, machine learning and deep learning?',
        ['subset|part of', 'machine learning|ml', 'deep learning', 'neural network', 'data', 'learn from|learns from|learning from', 'rules|rule-based|programmed'],
        'AI is the broad goal of making machines act intelligently. Machine learning is a subset where systems learn patterns from data instead of following fixed rules. Deep learning is a subset of machine learning that uses many layer neural networks, and it powers modern vision and language models.',
        'Think of three nested circles.'),
      Q(0, 'What is a large language model and how does it generate text?',
        ['transformer', 'token', 'predict', 'next token|next word', 'trained|training', 'probab', 'context'],
        'A large language model is a transformer based neural network trained on huge amounts of text. It splits input into tokens and predicts the next token from the context using probabilities, repeating this step to build a full response.',
        'Mention tokens and next token prediction.'),
      Q(1, 'What is prompt engineering and what makes a good prompt?',
        ['clear|specific', 'context', 'instruction', 'example|few-shot|few shot', 'format|output format', 'role|persona', 'iterate|iteration|test'],
        'Prompt engineering is designing inputs so a model gives reliable outputs. A good prompt is specific, gives context, states the task and the output format, and can include examples. You then test it on edge cases and iterate.',
        'Context, task, format, examples.'),
      Q(1, 'What is an embedding and where would you use one?',
        ['vector', 'numbers|numerical', 'meaning|semantic', 'similar|similarity', 'cosine|distance', 'search', 'retrieval|rag|recommend'],
        'An embedding is a vector of numbers that captures the meaning of text or images, so similar items sit close together. You use embeddings for semantic search, recommendations, clustering and retrieval for RAG, comparing vectors with cosine similarity.',
        'Say what is close in vector space.'),
      Q(2, 'Explain retrieval augmented generation, RAG. When would you choose it over fine-tuning?',
        ['retriev', 'vector database|vector db|vector store', 'embedding', 'chunk', 'context', 'hallucinat', 'up to date|fresh|latest|private data', 'fine-tun'],
        'RAG retrieves relevant chunks from a knowledge base using embeddings and a vector store, then passes them to the model as context. It reduces hallucinations and works with fresh or private data without retraining. I choose fine-tuning when I need a style, format or skill change, not new facts.',
        'New facts versus new behaviour.'),
      Q(2, 'How would you evaluate an LLM powered application before shipping it?',
        ['test set|dataset|golden', 'metric', 'human|manual review', 'llm as a judge|llm-as-judge|judge', 'regression', 'hallucinat|faithful|grounded', 'latency', 'cost', 'edge case|adversarial'],
        'I build a golden test set of real and edge case inputs, define metrics like accuracy, groundedness and format validity, and combine human review with an LLM as a judge. I run regression tests on every prompt or model change and track latency and cost.',
        'Offline evals, then regression tests.'),

    { q: (r) => `Walk me through your career so far, the biggest impact you have made, and the scope you want in your next ${r} role.`,
      kw: ['experience|years', 'led|lead|owned|mentor', 'impact|result|improv|reduced|increased|revenue|saved', 'team|stakeholder', 'architecture|system|scale|strategy', 'next|goal|scope|looking'] },
  ];
  const INTRO_MODEL = 'A strong introduction has a one line summary of who you are, two or three relevant projects or experiences with outcomes, your key skills, and a closing line on why this role excites you. Keep it under ninety seconds.';

  NS.LEVELS = LEVELS;
  NS.ROLES = ROLES;
  NS.BANK = BANK;

  // Seeded shuffle so a session is stable but varied
  function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

  NS.buildInterview = function (roleKey, level, count, customRole, seed) {
    const r = rng(seed || Date.now());
    const roleName = roleKey === 'other' ? (customRole || 'Software Engineer') : (ROLES[roleKey].full || ROLES[roleKey].title);
    const nb = count >= 10 ? 2 : 1;
    const nt = count - 1 - nb;
    const pool = BANK[roleKey].map((q) => ({ ...q, d: Math.abs(q.t - level) + r() * 0.5 }));
    pool.sort((a, b) => a.d - b.d);
    const tech = pool.slice(0, nt).sort((a, b) => a.t - b.t || r() - 0.5);
    const intro = INTRO[level];
    const beh = BEHAV.map((b) => ({ b, k: r() })).sort((a, b) => a.k - b.k).slice(0, nb).map((x) => x.b);
    const out = [];
    out.push({ type: 'intro', t: level, q: intro.q(roleName), kw: intro.kw, model: INTRO_MODEL, modelLabel: 'What a strong answer includes', hint: 'Summary, projects, skills, why this role.', topic: 'Introduction' });
    tech.forEach((q) => out.push({ ...q, topic: q.q.replace(/^(What is|What are|Explain|How do you|How does|How would you|Design|Walk me through)\s+/i, '').replace(/[?.].*$/, '').slice(0, 38) }));
    beh.forEach((b) => out.push({ type: 'behav', t: level, q: b.q, kw: b.kw, model: b.model, modelLabel: 'What a strong answer includes', hint: b.hint, topic: 'Behavioural' }));
    return { roleName, questions: out };
  };

  if (typeof module !== 'undefined') module.exports = NS;
})();

<script>/* From-scratch artificial neural network (multi layer perceptron).
   13 inputs -> 16 tanh -> 8 tanh -> 4 sigmoid outputs, trained with mini-batch Adam on MSE.
   No libraries. Works in the browser and in Node. */
(function () {
  const NS = (globalThis.IAI = globalThis.IAI || {});

  function rng(seed) {
    let a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const clip = (x, lo = 0, hi = 1) => Math.min(hi, Math.max(lo, x));

  const FEATURES = [
    { key: 'len', label: 'Answer length fit', hint: 'Word count against the ideal range for this question type' },
    { key: 'kw', label: 'Keyword coverage', hint: 'Share of expected concepts that were mentioned' },
    { key: 'sim', label: 'Similarity to model answer', hint: 'Cosine similarity between your words and the reference answer' },
    { key: 'ld', label: 'Vocabulary variety', hint: 'Unique words relative to length' },
    { key: 'wl', label: 'Word precision', hint: 'Average word length, a proxy for technical vocabulary' },
    { key: 'fill', label: 'Filler words', hint: 'Like, basically, you know, actually (higher means more fillers)' },
    { key: 'sm', label: 'Structure markers', hint: 'First, because, for example, therefore, finally' },
    { key: 'ex', label: 'Examples and specifics', hint: 'Numbers, examples and phrases like "in my project"' },
    { key: 'hedge', label: 'Hedging', hint: 'Maybe, I think, not sure (higher means more hedging)' },
    { key: 'pace', label: 'Speaking pace fit', hint: 'Words per minute against the 110 to 160 comfort zone' },
    { key: 'dur', label: 'Answer duration fit', hint: 'Time spent speaking against the ideal range' },
    { key: 'kd', label: 'Keyword density', hint: 'Concept hits per 20 words' },
    { key: 'lvl', label: 'Experience level', hint: 'Fresher 0, Intern 0.33, Intermediate 0.67, Advanced 1' },
  ];
  const OUTPUTS = ['Content', 'Structure', 'Clarity', 'Delivery'];

  class MLP {
    constructor(sizes, seed) {
      this.sizes = sizes;
      const r = rng(seed || 7);
      this.W = []; this.b = []; this.mW = []; this.vW = []; this.mb = []; this.vb = [];
      for (let l = 0; l < sizes.length - 1; l++) {
        const nin = sizes[l], nout = sizes[l + 1];
        const lim = Math.sqrt(6 / (nin + nout));
        const W = Array.from({ length: nout }, () => Array.from({ length: nin }, () => (r() * 2 - 1) * lim));
        this.W.push(W);
        this.b.push(new Array(nout).fill(0));
        this.mW.push(W.map((row) => row.map(() => 0)));
        this.vW.push(W.map((row) => row.map(() => 0)));
        this.mb.push(new Array(nout).fill(0));
        this.vb.push(new Array(nout).fill(0));
      }
      this.t = 0;
    }
    forward(x, keep) {
      const acts = [x];
      let a = x;
      const L = this.W.length;
      for (let l = 0; l < L; l++) {
        const W = this.W[l], b = this.b[l];
        const out = new Array(W.length);
        for (let j = 0; j < W.length; j++) {
          let s = b[j];
          const row = W[j];
          for (let i = 0; i < row.length; i++) s += row[i] * a[i];
          out[j] = l === L - 1 ? 1 / (1 + Math.exp(-s)) : Math.tanh(s);
        }
        a = out;
        if (keep) acts.push(a);
      }
      return keep ? acts : a;
    }
    predict(x) { return this.forward(x, false); }
    // One epoch of mini-batch Adam. Returns mean squared error.
    trainEpoch(X, Y, lr, batch, r) {
      const n = X.length, L = this.W.length;
      const idx = Array.from({ length: n }, (_, i) => i);
      for (let i = n - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [idx[i], idx[j]] = [idx[j], idx[i]]; }
      let total = 0;
      for (let s = 0; s < n; s += batch) {
        const ids = idx.slice(s, s + batch);
        const gW = this.W.map((W) => W.map((row) => new Array(row.length).fill(0)));
        const gb = this.b.map((b) => new Array(b.length).fill(0));
        for (const id of ids) {
          const acts = this.forward(X[id], true);
          const out = acts[L], y = Y[id];
          let delta = out.map((o, k) => { const e = o - y[k]; total += e * e; return 2 * e * o * (1 - o) / out.length; });
          for (let l = L - 1; l >= 0; l--) {
            const aPrev = acts[l];
            const W = this.W[l];
            for (let j = 0; j < W.length; j++) {
              gb[l][j] += delta[j];
              const g = gW[l][j];
              for (let i = 0; i < aPrev.length; i++) g[i] += delta[j] * aPrev[i];
            }
            if (l > 0) {
              const nd = new Array(aPrev.length).fill(0);
              for (let i = 0; i < aPrev.length; i++) {
                let s2 = 0;
                for (let j = 0; j < W.length; j++) s2 += W[j][i] * delta[j];
                nd[i] = s2 * (1 - aPrev[i] * aPrev[i]);
              }
              delta = nd;
            }
          }
        }
        this.t++;
        const b1 = 0.9, b2 = 0.999, eps = 1e-8, m = ids.length;
        const c1 = 1 - Math.pow(b1, this.t), c2 = 1 - Math.pow(b2, this.t);
        for (let l = 0; l < L; l++) {
          for (let j = 0; j < this.W[l].length; j++) {
            for (let i = 0; i < this.W[l][j].length; i++) {
              const g = gW[l][j][i] / m;
              const mm = (this.mW[l][j][i] = b1 * this.mW[l][j][i] + (1 - b1) * g);
              const vv = (this.vW[l][j][i] = b2 * this.vW[l][j][i] + (1 - b2) * g * g);
              this.W[l][j][i] -= lr * (mm / c1) / (Math.sqrt(vv / c2) + eps);
            }
            const g = gb[l][j] / m;
            const mm = (this.mb[l][j] = b1 * this.mb[l][j] + (1 - b1) * g);
            const vv = (this.vb[l][j] = b2 * this.vb[l][j] + (1 - b2) * g * g);
            this.b[l][j] -= lr * (mm / c1) / (Math.sqrt(vv / c2) + eps);
          }
        }
      }
      return total / (n * this.sizes[this.sizes.length - 1]);
    }
    evaluate(X, Y) {
      let se = 0, ae = 0, n = 0;
      for (let i = 0; i < X.length; i++) {
        const p = this.predict(X[i]);
        for (let k = 0; k < p.length; k++) { const e = p[k] - Y[i][k]; se += e * e; ae += Math.abs(e); n++; }
      }
      return { mse: se / n, mae: ae / n };
    }
    paramCount() { return this.W.reduce((s, W, l) => s + W.length * W[0].length + this.b[l].length, 0); }
  }

  /* The rubric that produces training labels. It encodes what a good interview
     answer looks like. In a real deployment, replace this with human rated answers. */
  function teacher(f) {
    const [len, kw, sim, ld, wl, fill, sm, ex, hedge, pace, dur, kd, lvl] = f;
    const content = clip(0.42 * kw + 0.22 * sim + 0.16 * ex + 0.10 * kd + 0.10 * len - lvl * 0.10 * (1 - kw));
    const structure = clip(0.40 * sm + 0.20 * len + 0.20 * ex + 0.20 * dur - lvl * 0.10 * (1 - sm));
    const clarity = clip(0.30 * (1 - fill) + 0.25 * ld + 0.20 * wl + 0.25 * (1 - hedge));
    const delivery = clip(0.35 * pace + 0.25 * dur + 0.25 * (1 - fill) + 0.15 * (1 - hedge));
    return [content, structure, clarity, delivery];
  }

  function makeDataset(n, seed) {
    const r = rng(seed);
    const g = () => { let u = 0; for (let i = 0; i < 6; i++) u += r(); return (u - 3) / 1.5; }; // approx N(0,1)
    const X = [], Y = [];
    for (let i = 0; i < n; i++) {
      const q = clip(0.5 * r() + 0.5 * clip(0.5 + 0.22 * g()));
      const lvl = Math.floor(r() * 4) / 3;
      const f = [
        clip(0.30 + 0.65 * q + 0.14 * g()),
        clip(Math.pow(q, 1.1) + 0.14 * g()),
        clip(0.65 * q + 0.20 * q * r() + 0.10 * g()),
        clip(0.40 + 0.40 * q + 0.12 * g()),
        clip(0.35 + 0.40 * q + 0.15 * g()),
        clip((1 - q) * r() * 0.9 + 0.05 * Math.abs(g())),
        clip(0.10 + 0.75 * q + 0.18 * g()),
        clip(0.05 + 0.75 * q + 0.22 * g()),
        clip((1 - q) * r() * 0.8 + 0.05 * Math.abs(g())),
        clip(0.40 + 0.50 * q + 0.20 * g()),
        clip(0.35 + 0.55 * q + 0.22 * g()),
        clip(0.70 * Math.pow(q, 1.1) + 0.15 * g()),
        lvl,
      ];
      const y = teacher(f).map((v) => clip(v + 0.03 * g()));
      X.push(f); Y.push(y);
    }
    return { X, Y };
  }

  // Train asynchronously so the page can draw the loss curve while it learns.
  async function trainModel(opts = {}) {
    const { epochs = 45, nTrain = 3200, nTest = 600, lr = 0.006, batch = 32, seed = 42, onEpoch, yieldEvery = 1 } = opts;
    const net = new MLP([13, 16, 8, 4], seed);
    const train = makeDataset(nTrain, seed + 1), test = makeDataset(nTest, seed + 2);
    const r = rng(seed + 3);
    const history = [];
    for (let e = 0; e < epochs; e++) {
      const loss = net.trainEpoch(train.X, train.Y, lr * (1 - 0.7 * e / epochs), batch, r);
      const val = net.evaluate(test.X, test.Y).mse;
      history.push({ epoch: e + 1, loss, val });
      if (onEpoch) onEpoch(history[history.length - 1], e, epochs);
      if (typeof setTimeout === 'function' && (e + 1) % yieldEvery === 0) await new Promise((res) => setTimeout(res, 0));
    }
    const m = net.evaluate(test.X, test.Y);
    return { net, history, test: m, nTrain, nTest, epochs };
  }

  NS.ANN = { MLP, FEATURES, OUTPUTS, makeDataset, teacher, trainModel, clip, rng };
  if (typeof module !== 'undefined') module.exports = NS.ANN;
})();
</script>
<script>/* Turns a spoken answer (transcript + timing) into 13 numeric features, asks the
   neural network for four scores, and writes student friendly feedback. */
(function () {
  const NS = (globalThis.IAI = globalThis.IAI || {});
  const { clip } = NS.ANN;

  const STOP = new Set('a an the and or but if so of to in on at for with by from as is are was were be been it its this that these those i you we they he she my our your their me do does did have has had will would can could should not no yes very just also than then there here what which who when where how why about into over under more most some any'.split(' '));
  const FILLERS = ['um', 'uh', 'uhm', 'umm', 'er', 'erm', 'hmm', 'like', 'you know', 'basically', 'actually', 'literally', 'i mean', 'you see'];
  const HEDGES = ['maybe', 'i think', 'i guess', "i'm not sure", 'not sure', 'probably', 'kind of', 'sort of', "i don't know", 'perhaps', 'might be'];
  const STRUCT = ['first', 'firstly', 'second', 'secondly', 'third', 'then', 'next', 'finally', 'because', 'therefore', 'so that', 'for example', 'for instance', 'such as', 'in summary', 'to summarize', 'overall', 'however', 'trade-off', 'tradeoff', 'on the other hand', 'as a result', 'which means', 'the reason', 'in my experience'];
  const EXAMPLE_RX = /\b\d+(\.\d+)?%?|for example|for instance|such as|i built|i made|i used|i worked|i developed|i created|in my project|in my previous|at my internship|in college|we used|our team|my team/g;

  const RANGES = {
    intro: { words: [60, 150], secs: [30, 90] },
    tech: { words: [55, 150], secs: [35, 120] },
    behav: { words: [80, 190], secs: [50, 150] },
  };

  const esc = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const norm = (t) => t.toLowerCase().replace(/[‘’]/g, "'");
  const tokens = (t) => norm(t).match(/[a-z0-9']+/g) || [];

  function phraseMatches(text, phrase, prefix) {
    const rx = new RegExp("(?<![a-z0-9'])" + esc(phrase) + (prefix ? "[a-z0-9']*" : "(?![a-z0-9'])"), 'g');
    const out = []; let m;
    while ((m = rx.exec(text))) { out.push({ start: m.index, end: m.index + m[0].length }); if (m[0].length === 0) rx.lastIndex++; }
    return out;
  }

  function tf(words) {
    const m = new Map();
    words.filter((w) => !STOP.has(w) && w.length > 1).forEach((w) => m.set(w, (m.get(w) || 0) + 1));
    return m;
  }
  function cosine(a, b) {
    let dot = 0, na = 0, nb = 0;
    a.forEach((v, k) => { na += v * v; if (b.has(k)) dot += v * b.get(k); });
    b.forEach((v) => (nb += v * v));
    return na && nb ? dot / Math.sqrt(na * nb) : 0;
  }
  const stem = (w) => w.replace(/(ing|ed|es|s)$/, '');
  const stemTf = (m) => { const o = new Map(); m.forEach((v, k) => o.set(stem(k), (o.get(stem(k)) || 0) + v)); return o; };

  function rangeFit(v, lo, hi) {
    if (v < lo) return clip(v / lo);
    if (v <= hi) return 1;
    return clip(1 - (v - hi) / hi * 0.8, 0.2, 1);
  }

  function analyze(text, q, timing, level) {
    const lower = norm(text || '');
    const words = tokens(lower);
    const wc = words.length;
    const type = q.type || 'tech';
    const R = RANGES[type];
    const typed = !!(timing && timing.typed);

    const matched = [], missed = [], kwRanges = [];
    q.kw.forEach((k) => {
      const alts = k.split('|');
      let hit = false;
      alts.forEach((a) => { const m = phraseMatches(lower, a.trim(), true); if (m.length) { hit = true; kwRanges.push(...m.map((x) => ({ ...x, cls: 'kw' }))); } });
      (hit ? matched : missed).push(alts[0].trim());
    });

    const fillerCounts = {}, fillRanges = []; let fillerTotal = 0;
    FILLERS.forEach((f) => { const m = phraseMatches(lower, f, false); if (m.length) { fillerCounts[f] = m.length; fillerTotal += m.length; fillRanges.push(...m.map((x) => ({ ...x, cls: 'fill' }))); } });
    let hedgeTotal = 0; const hedgeRanges = [];
    HEDGES.forEach((h) => { const m = phraseMatches(lower, h, false); hedgeTotal += m.length; hedgeRanges.push(...m.map((x) => ({ ...x, cls: 'hedge' }))); });
    const structHits = STRUCT.filter((s) => phraseMatches(lower, s, false).length);
    const examples = (lower.match(EXAMPLE_RX) || []).length;

    const uniq = new Set(words).size;
    const avgWl = wc ? words.reduce((s, w) => s + w.length, 0) / wc : 0;
    const ref = tf(tokens(q.model + ' ' + q.kw.map((k) => k.split('|')[0]).join(' ')));
    const cos = cosine(stemTf(tf(words)), stemTf(ref));

    const speakSec = !typed && timing && timing.speakSec ? timing.speakSec : 0;
    const wpm = speakSec >= 4 ? Math.round(wc / (speakSec / 60)) : null;
    let paceFit;
    if (typed) paceFit = 0.65;
    else if (wpm == null) paceFit = 0.25;
    else { const d = wpm < 110 ? 110 - wpm : wpm > 160 ? wpm - 160 : 0; paceFit = clip(1 - d / 70); }
    const durFit = typed || !speakSec ? rangeFit(wc, R.words[0], R.words[1]) : rangeFit(speakSec, R.secs[0], R.secs[1]);

    const features = [
      rangeFit(wc, R.words[0], R.words[1]),
      q.kw.length ? clip(matched.length / Math.max(3, Math.ceil(q.kw.length * 0.6))) : 0,
      clip(cos / 0.55),
      wc ? clip((uniq / Math.sqrt(wc) - 2.5) / 6) : 0,
      clip((avgWl - 3.4) / 2.6),
      wc ? clip(fillerTotal / wc / 0.08) : 0,
      clip(structHits.length / 5),
      clip(examples / 3),
      wc ? clip(hedgeTotal / wc / 0.05) : 0,
      paceFit,
      durFit,
      wc ? clip(matched.length / (wc / 20 + 1) / 1.2) : 0,
      level / 3,
    ];
    return {
      features, wc, wpm, speakSec: Math.round(speakSec), thinkSec: timing && timing.thinkSec != null ? Math.round(timing.thinkSec) : null,
      typed, matched, missed, fillerCounts, fillerTotal, hedgeTotal, structHits, examples,
      ranges: [...kwRanges, ...fillRanges, ...hedgeRanges], text: text || '',
    };
  }

  function score(net, features, wc) {
    if (wc < 3) return { dims: [5, 5, 5, 5], overall: 5, skipped: true };
    const o = net.predict(features).map((v) => Math.round(v * 100));
    return { dims: o, overall: Math.round(0.4 * o[0] + 0.2 * o[1] + 0.2 * o[2] + 0.2 * o[3]), skipped: false };
  }

  function feedback(an, sc, q) {
    const f = an.features, good = [], fix = [];
    const R = RANGES[q.type || 'tech'];
    if (sc.skipped) return { good: [], fix: ['No answer was captured. Check your microphone or type your answer, then try again.'] };
    if (f[1] >= 0.6) good.push(`Covered the key ideas: ${an.matched.slice(0, 4).join(', ')}.`);
    else if (an.matched.length) good.push(`Touched on ${an.matched.slice(0, 3).join(', ')}.`);
    if (f[6] >= 0.6) good.push(`Clear structure using signposts like "${an.structHits.slice(0, 2).join('", "')}".`);
    if (f[7] >= 0.5) good.push('Backed the answer with an example, a number or your own experience.');
    if (f[5] <= 0.2 && an.wc > 25) good.push('Clean delivery with very few filler words.');
    if (!an.typed && an.wpm && an.wpm >= 110 && an.wpm <= 160) good.push(`Comfortable pace at ${an.wpm} words per minute.`);

    if (f[1] < 0.6 && an.missed.length) fix.push(`Add the missing concepts: ${an.missed.slice(0, 4).join(', ')}.`);
    if (an.wc < R.words[0]) fix.push(`The answer was short (${an.wc} words). Aim for ${R.words[0]} to ${R.words[1]} words, about ${R.secs[0]} to ${R.secs[1]} seconds.`);
    if (an.wc > R.words[1] * 1.3) fix.push(`The answer ran long (${an.wc} words). Lead with the main point and trim side details.`);
    if (f[6] < 0.4) fix.push(q.type === 'behav' ? 'Use STAR: Situation, Task, Action, Result.' : 'Give it a shape: definition, how it works, an example, then a trade-off.');
    if (f[7] < 0.3) fix.push('Add one concrete example, number or project from your own experience.');
    if (f[5] > 0.35) { const top = Object.entries(an.fillerCounts).sort((a, b) => b[1] - a[1])[0]; fix.push(`Reduce filler words (${an.fillerTotal} found, most often "${top[0]}"). Pause silently instead.`); }
    if (f[8] > 0.35) fix.push('Replace hedges like "I think" or "maybe" with direct statements.');
    if (!an.typed && an.wpm) { if (an.wpm > 170) fix.push(`You spoke fast (${an.wpm} wpm). Slow down to around 130.`); else if (an.wpm < 95) fix.push(`Your pace was slow (${an.wpm} wpm). Practise to reach about 120 to 140.`); }
    if (an.thinkSec != null && an.thinkSec > 12) fix.push(`It took ${an.thinkSec} seconds to start. Buy time with "Let me think for a moment" and then give a structured answer.`);
    return { good: good.slice(0, 3), fix: fix.slice(0, 4) };
  }

  function highlight(an) {
    const esch = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    const text = an.text;
    const lowerLen = norm(text).length === text.length;
    if (!lowerLen) return esch(text);
    const prio = { fill: 3, hedge: 2, kw: 1 };
    const r = [...an.ranges].sort((a, b) => a.start - b.start || prio[b.cls] - prio[a.cls] || (b.end - b.start) - (a.end - a.start));
    let out = '', pos = 0;
    for (const m of r) {
      if (m.start < pos) continue;
      out += esch(text.slice(pos, m.start)) + `<mark class="${m.cls}">${esch(text.slice(m.start, m.end))}</mark>`;
      pos = m.end;
    }
    return out + esch(text.slice(pos));
  }
