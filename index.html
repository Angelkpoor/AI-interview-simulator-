  const modelPill = () => state.modelBusy ? `${ic('network')}<span>Training neural network...</span>` : `${ic('network')}<span><b>ANN ready</b> · ${state.model.net.paramCount()} weights</span>`;
  const sideTop = (btn) => `<div class="side-top"><div class="pill" id="sidePill">${modelPill()}</div>${btn || `<button class="circle" data-act="help" title="How it works" aria-label="Help">${ic('help')}</button>`}</div>`;

  /* ---------- setup ---------- */
  function setupHTML() {
    const c = state.cfg, role = ROLES[c.role];
    const rn = c.role === 'other' ? (c.custom || 'your role') : role.title;
    return `<section class="view"><div class="col-main">
      <div class="head"><h1>Hi, ${esc(state.name || 'there')}! 👋</h1><p>Mock Interview Simulator | Set up your session</p></div>
      <h3 class="sec">Choose your role</h3>
      <div class="role-grid">${Object.entries(ROLES).map(([k, r]) => `<button class="role-tile ${c.role === k ? 'active' : ''}" data-role="${k}"><span class="tick">${ic('check')}</span><div class="ri">${ic(r.icon)}</div><b>${r.title}</b><span>${r.blurb}</span></button>`).join('')}</div>
      ${c.role === 'other' ? `<div class="field"><label for="customRole">Which role are you preparing for?</label><input class="input" id="customRole" placeholder="e.g. Data Analyst, DevOps Engineer" value="${esc(c.custom)}"></div>` : ''}
      <h3 class="sec">Your experience level</h3>
      <div class="level-grid">${LEVELS.map((l) => `<button class="level-tile ${c.level === l.key ? 'active' : ''}" data-level="${l.key}"><div class="bars">${[0, 1, 2, 3].map((i) => `<i class="${i <= l.key ? 'on' : ''}"></i>`).join('')}</div><b>${l.name}</b><span>${l.sub}. ${l.blurb}</span></button>`).join('')}</div>
      <h3 class="sec">Interview settings</h3>
      <div class="set-row">
        <div class="field" style="margin:0"><label for="nameIn">Your name</label><input class="input" id="nameIn" placeholder="Alex" value="${esc(state.name)}" maxlength="24"></div>
        <div class="field" style="margin:0"><label>Number of questions</label><div class="seg">${[[5, 'Quick 5'], [7, 'Standard 7'], [10, 'Full 10']].map(([n, t]) => `<button class="${c.count === n ? 'on' : ''}" data-count="${n}">${t}</button>`).join('')}</div></div>
      </div>
      <div class="toggles">
        <div class="tog ${c.cam ? 'on' : ''}" data-tog="cam"><div>Start with my camera on<small>Optional. Video stays on your device and is never recorded or uploaded.</small></div><div class="sw"></div></div>
        <div class="tog ${state.settings.speak ? 'on' : ''}" data-tog="speak"><div>Nova reads each question aloud<small>Uses your browser's text to speech voice.</small></div><div class="sw"></div></div>
      </div>
      <div class="start-row"><button class="btn primary" data-act="start" ${state.modelBusy ? 'disabled' : ''}>${state.modelBusy ? 'Preparing the AI...' : 'Start interview'} ${ic('arrowR')}</button><small>${c.count} questions · ${rn} · ${LEVELS[c.level].name}</small></div>
    </div>
    <aside class="col-side">${sideTop()}
      <div class="card devcheck"><h3>Device check</h3><p class="sub" style="margin-bottom:12px">Test your camera and microphone before you begin.</p>
        <video id="devVideo" playsinline muted></video><div class="meter"><i id="devMeter"></i></div>
        <button class="btn ghost sm" data-act="test" style="width:100%;margin-top:10px" id="testBtn">${ic('video')} Test camera and mic</button></div>
      <div class="card"><h3 style="margin-bottom:12px">What happens next</h3><div class="steps">
        <div class="step"><i>1</i><span>Nova asks a question and reads it aloud.</span></div>
        <div class="step"><i>2</i><span>You answer out loud. Speech turns into text live.</span></div>
        <div class="step"><i>3</i><span>A neural network scores your answer and explains how to improve.</span></div></div></div>
      <div class="tip-card"><h3>Best in Chrome</h3><p>Speech recognition works in Chrome and Edge. In other browsers, type your answers instead.</p>${crown()}</div>
    </aside></section>`;
  }
  const crown = () => `<svg class="art" viewBox="0 0 100 80"><defs><linearGradient id="cr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7db0ff"/><stop offset="1" stop-color="#2563eb"/></linearGradient></defs><path d="M8 66l-2-44 22 20 22-32 22 32 22-20-2 44z" fill="url(#cr)"/><rect x="8" y="68" width="84" height="8" rx="3" fill="#1d4fd8"/><circle cx="6" cy="22" r="5" fill="#9cc2ff"/><circle cx="50" cy="8" r="5" fill="#9cc2ff"/><circle cx="94" cy="22" r="5" fill="#9cc2ff"/></svg>`;

  async function testDevices() {
    if (state.test) { stopTest(); $('#testBtn').innerHTML = `${ic('video')} Test camera and mic`; $('#devMeter').style.width = '0'; return; }
    const media = new Speech.Media();
    try { await media.startMic(); } catch (e) { toast('Microphone is blocked or unavailable. You can still type your answers.'); }
    try { await media.startCam($('#devVideo')); } catch (e) { toast('Camera is unavailable. That is fine, the interview works without it.'); }
    if (!media.stream && !media.vstream) return;
    const t = { media, raf: 0 }; state.test = t;
    const loop = () => { const m = $('#devMeter'); if (!m || state.test !== t) return; m.style.width = Math.round(media.level() * 100) + '%'; t.raf = requestAnimationFrame(loop); };
    loop(); $('#testBtn').innerHTML = `${ic('stop')} Stop test`;
  }

  /* ---------- history ---------- */
  function historyHTML() {
    const H = state.history;
    const best = H.length ? Math.max(...H.map((h) => h.summary.overall)) : 0;
    const avg = H.length ? Math.round(H.reduce((s, h) => s + h.summary.overall, 0) / H.length) : 0;
    return `<section class="view"><div class="col-main">
      <div class="head"><h1>Your reports</h1><p>Past interviews saved in this browser</p></div>
      <h3 class="sec">Sessions</h3>
      ${H.length ? `<div class="hist">${H.map((h, i) => `<button class="hist-item" data-open="${i}"><div class="score-ring" style="--p:${h.summary.overall}"><span>${h.summary.overall}</span></div><div><b>${esc(h.roleName)} · ${LEVELS[h.level].name}</b><small>${new Date(h.ts).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' })} · ${h.answers.length} questions · ${h.summary.verdict}</small></div><div class="mini-dims">${ANN.OUTPUTS.map((n, k) => `<span>${n.slice(0, 4)} ${h.summary.dims[k]}</span>`).join('')}</div></button>`).join('')}</div>`
        : `<div class="empty">${ic('folder')}<p>No interviews yet. Finish one and the report is saved here.</p><button class="btn primary sm" data-nav="setup">Start an interview</button></div>`}
    </div><aside class="col-side">${sideTop()}
      <div class="kv"><div class="card"><div class="n">${H.length}</div><div class="l">Interviews</div></div><div class="card"><div class="n">${best || '-'}</div><div class="l">Best score</div></div><div class="card"><div class="n">${avg || '-'}</div><div class="l">Average</div></div><div class="card"><div class="n">${H.length > 1 ? (H[0].summary.overall - H[H.length - 1].summary.overall >= 0 ? '+' : '') + (H[0].summary.overall - H[H.length - 1].summary.overall) : '-'}</div><div class="l">Change since first</div></div></div>
      ${H.length ? `<button class="btn danger sm" data-act="clear">${ic('trash')} Clear history</button>` : ''}
      <p class="sub" style="font-size:12.5px;color:var(--muted);line-height:1.5">Reports are stored only in this browser on this device.</p>
    </aside></section>`;
  }

  /* ---------- settings ---------- */
  function settingsHTML() {
    const s = state.settings;
    const voices = Speech.Voice.voices().filter((v) => v.lang.startsWith('en'));
    return `<section class="view"><div class="col-main">
      <div class="head"><h1>Settings</h1><p>Voice, language and feedback preferences</p></div>
      <h3 class="sec">Interview</h3>
      <div class="toggles" style="margin-top:0">
        <div class="tog ${s.speak ? 'on' : ''}" data-tog="speak"><div>Read questions aloud<small>Nova speaks each question.</small></div><div class="sw"></div></div>
        <div class="tog ${s.autoListen ? 'on' : ''}" data-tog="autoListen"><div>Start listening automatically<small>The microphone opens as soon as Nova finishes the question.</small></div><div class="sw"></div></div>
        <div class="tog ${s.instant ? 'on' : ''}" data-tog="instant"><div>Instant feedback after every answer<small>Turn off for a realistic interview and read everything in the report.</small></div><div class="sw"></div></div>
      </div>
      <h3 class="sec">Speech</h3>
      <div class="set-row">
        <div class="field" style="margin:0"><label for="lang">Recognition language and accent</label><select class="sel" id="lang">${[['en-IN', 'English (India)'], ['en-US', 'English (US)'], ['en-GB', 'English (UK)'], ['en-AU', 'English (Australia)']].map(([v, t]) => `<option value="${v}" ${s.lang === v ? 'selected' : ''}>${t}</option>`).join('')}</select></div>
        <div class="field" style="margin:0"><label for="rate">Nova speaking speed: <span id="rateV">${s.rate.toFixed(1)}x</span></label><input type="range" id="rate" min="0.7" max="1.3" step="0.1" value="${s.rate}" style="accent-color:var(--blue);margin-top:14px"></div>
      </div>
      <div class="field"><label for="voice">Nova's voice</label><select class="sel" id="voice"><option value="">Automatic</option>${voices.map((v) => `<option value="${esc(v.voiceURI)}" ${s.voice === v.voiceURI ? 'selected' : ''}>${esc(v.name)} (${v.lang})</option>`).join('')}</select></div>
      <div class="start-row"><button class="btn ghost sm" data-act="testvoice">${ic('vol')} Preview voice</button></div>
    </div><aside class="col-side">${sideTop()}
      <div class="card"><h3>Privacy</h3><p class="sub" style="line-height:1.55;margin-top:6px">Your camera video is shown on screen only. It is never recorded or uploaded. Scoring runs entirely in your browser.<br><br>Speech to text is done by your browser. In Chrome and Edge the audio is sent to the browser vendor's speech service, so avoid saying anything private. Typed answers never leave your device.</p></div>
    </aside></section>`;
  }

  /* ---------- ANN Lab ---------- */
  const SHORT = ['length', 'keywords', 'similarity', 'variety', 'precision', 'fillers', 'structure', 'examples', 'hedging', 'pace', 'duration', 'density', 'level'];
  function netSvg(net) {
    const sizes = net.sizes, W = 760, H = 380, xs = sizes.map((_, i) => 110 + i * ((W - 220) / (sizes.length - 1)));
    const ys = sizes.map((n) => Array.from({ length: n }, (_, i) => 24 + (H - 48) * (n === 1 ? .5 : i / (n - 1))));
    let edges = '';
    for (let l = 0; l < net.W.length; l++) {
      let mx = 0; net.W[l].forEach((r) => r.forEach((w) => (mx = Math.max(mx, Math.abs(w)))));
      net.W[l].forEach((row, j) => row.forEach((w, i) => {
        const o = Math.min(0.55, (Math.abs(w) / mx) * 0.6); if (o < 0.07) return;
        edges += `<line x1="${xs[l]}" y1="${ys[l][i]}" x2="${xs[l + 1]}" y2="${ys[l + 1][j]}" stroke="${w > 0 ? '#2563eb' : '#e5484d'}" stroke-opacity="${o.toFixed(2)}" stroke-width="1"/>`;
      }));
    }
    const nodes = sizes.map((n, l) => ys[l].map((y) => `<circle cx="${xs[l]}" cy="${y}" r="${l === 0 || l === sizes.length - 1 ? 8 : 6.5}" fill="${l === 0 ? '#e4ecff' : l === sizes.length - 1 ? '#2563eb' : '#fff'}" stroke="#2563eb" stroke-width="1.6"/>`).join('')).join('');
    const il = ys[0].map((y, i) => `<text x="${xs[0] - 16}" y="${y + 4}" text-anchor="end" font-size="11.5" fill="#51608a">${SHORT[i]}</text>`).join('');
    const ol = ys[sizes.length - 1].map((y, i) => `<text x="${xs[sizes.length - 1] + 18}" y="${y + 4}" font-size="12.5" font-weight="600" fill="#0f1b3d">${ANN.OUTPUTS[i]}</text>`).join('');
    const cap = ['Input features', 'Hidden layer 1 (tanh)', 'Hidden layer 2 (tanh)', 'Output (sigmoid)'].map((t, l) => `<text x="${xs[l]}" y="${H + 14}" text-anchor="middle" font-size="11.5" fill="#6c7a99">${t}</text>`).join('');
    return `<svg class="lab-svg" viewBox="0 0 ${W} ${H + 24}">${edges}${nodes}${il}${ol}${cap}</svg>`;
  }
  function lossSvg(hist) {
    const W = 600, Hh = 190, pl = 44, pb = 26, lo = -4.2, hi = -1.6;
    const y = (v) => 10 + (Hh - pb - 10) * (1 - (Math.log10(Math.max(v, 1e-5)) - lo) / (hi - lo));
    const n = Math.max(hist.length, 2), x = (i) => pl + (W - pl - 10) * (i / (Math.max(hist.length, 45) - 1));
    const path = (k) => hist.map((h, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)} ${Math.min(Hh - pb, Math.max(10, y(h[k]))).toFixed(1)}`).join(' ');
    const grid = [-4, -3, -2].map((e) => `<line x1="${pl}" x2="${W - 10}" y1="${y(Math.pow(10, e))}" y2="${y(Math.pow(10, e))}" stroke="#e3eaf7"/><text x="${pl - 8}" y="${y(Math.pow(10, e)) + 4}" text-anchor="end" font-size="10.5" fill="#8a97b5">1e${e}</text>`).join('');
    return `<svg class="lab-svg" viewBox="0 0 ${W} ${Hh}">${grid}<path d="${path('loss')}" fill="none" stroke="#2563eb" stroke-width="2.4" stroke-linecap="round"/><path d="${path('val')}" fill="none" stroke="#58d9f8" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="5 4"/><text x="${pl}" y="${Hh - 6}" font-size="11" fill="#6c7a99">epoch 1</text><text x="${W - 10}" y="${Hh - 6}" text-anchor="end" font-size="11" fill="#6c7a99">epoch ${hist.length || ''}</text></svg>`;
  }
  function labStats(m) {
    if (!m) return '';
    return `<div class="lab-stats"><div><b>${m.net.paramCount()}</b><span>weights and biases</span></div><div><b>${m.nTrain.toLocaleString()}</b><span>training samples</span></div><div><b>${m.test.mse.toExponential(1)}</b><span>test MSE (mean squared error)</span></div><div><b>${(m.test.mae * 100).toFixed(1)} pts</b><span>average error per score</span></div></div>`;
  }
  function labHTML() {
    const m = state.model;
    return `<section class="view"><div class="col-main">
      <div class="head"><h1>ANN Lab</h1><p>The artificial neural network that scores your answers</p></div>
      <h3 class="sec">Architecture</h3>
      <div class="card">${m ? netSvg(m.net) : '<p class="sub">Training...</p>'}<p class="sub" style="margin-top:8px">A multi layer perceptron: 13 features go in, 4 scores come out. Blue lines are positive weights, red lines are negative. Line strength shows how much a connection matters.</p></div>
      <h3 class="sec">Training <button class="btn ghost sm" data-act="retrain" id="retrainBtn">${ic('refresh')} Retrain from scratch</button></h3>
      <div class="card"><div id="lossBox">${lossSvg(m ? m.history : [])}</div><div id="labStats">${labStats(m)}</div>
        <p class="sub" style="margin-top:10px"><span style="color:#2563eb;font-weight:600">Solid</span> training loss, <span style="color:#1fb5d8;font-weight:600">dashed</span> validation loss (log scale). Backpropagation with the Adam optimiser.</p></div>
      <div class="note"><b>Honest note:</b> this demo network is trained on 3,200 synthetic answers whose labels come from a transparent scoring rubric, so it learns to apply that rubric smoothly (including how expectations rise with your level). To make it a true human-like examiner, replace the synthetic data with real answers rated by interviewers and retrain.</div>
    </div><aside class="col-side">${sideTop()}
      <div class="side-head"><h3>Playground</h3></div>
      <p class="sub" style="font-size:12.5px;color:var(--muted);margin-top:-12px">Move the features and watch the four scores respond.</p>
      <div id="outs"></div>
      <div id="sliders" style="display:flex;flex-direction:column;gap:10px"></div>
    </aside></section>`;
  }
  const PG = [0.7, 0.6, 0.55, 0.5, 0.5, 0.1, 0.6, 0.5, 0.1, 0.8, 0.8, 0.5, 0.33];
  function labMount() {
    const box = $('#sliders'); if (!box) return;
    const vals = PG.slice();
    box.innerHTML = ANN.FEATURES.map((f, i) => `<div class="slider-row" title="${esc(f.hint)}"><label for="pg${i}">${f.label}</label><output id="pgo${i}">${vals[i].toFixed(2)}</output><input type="range" id="pg${i}" min="0" max="1" step="0.01" value="${vals[i]}"></div>`).join('');
    const upd = () => {
      if (!state.model) return;
      const o = state.model.net.predict(vals);
      $('#outs').innerHTML = o.map((v, k) => `<div class="out-row"><b>${ANN.OUTPUTS[k]}</b><div class="bar"><i style="width:${Math.round(v * 100)}%"></i></div><span>${Math.round(v * 100)}</span></div>`).join('');
    };
    box.oninput = (e) => { const i = +e.target.id.slice(2); if (isNaN(i)) return; vals[i] = +e.target.value; $('#pgo' + i).textContent = vals[i].toFixed(2); upd(); };
    upd();
  }
  async function retrain() {
    if (state.lab.busy) return; state.lab.busy = true;
    const btn = $('#retrainBtn'); btn.disabled = true; btn.textContent = 'Training...';
    const m = await ANN.trainModel({ epochs: 45, seed: (Date.now() % 9000) + 1, onEpoch: (h, e, n) => { const b = $('#lossBox'); if (b && e % 2 === 0) b.innerHTML = lossSvg(window.__hist = (window.__hist || []).concat(h)); } });
    window.__hist = null; state.model = m; state.lab.busy = false;
    if (state.view === 'ann') { $('#views').innerHTML = labHTML(); labMount(); }
    toast('Retrained. Scores for your next interview use the new network.');
  }

  /* ---------- events ---------- */
  document.addEventListener('click', (e) => {
    const t = e.target;
    const nav = t.closest('[data-nav]'); if (nav && !nav.disabled) return go(nav.dataset.nav);
    const role = t.closest('[data-role]'); if (role) { state.cfg.role = role.dataset.role; save(); return go('setup'); }
    const lvl = t.closest('[data-level]'); if (lvl) { state.cfg.level = +lvl.dataset.level; save(); return go('setup'); }
    const cnt = t.closest('[data-count]'); if (cnt) { state.cfg.count = +cnt.dataset.count; save(); return go('setup'); }
    const tog = t.closest('[data-tog]');
    if (tog) { const k = tog.dataset.tog; if (k === 'cam') state.cfg.cam = !state.cfg.cam; else state.settings[k] = !state.settings[k]; save(); return go(state.view); }
    const open = t.closest('[data-open]'); if (open) return NS.Report.show(state.history[+open.dataset.open]);
    const act = t.closest('[data-act]'); if (!act) return;
    const a = act.dataset.act;
    if (a === 'help') helpModal();
    else if (a === 'start') {
      const c = state.cfg;
      if (c.role === 'other' && !c.custom.trim()) { toast('Type the role you are preparing for.'); const i = $('#customRole'); i && i.focus(); return; }
      NS.Interview.start();
    }
    else if (a === 'test') testDevices();
    else if (a === 'clear') modal('<h3>Clear all reports?</h3><p>This removes every saved interview from this browser.</p>', [{ label: 'Cancel' }, { label: 'Clear', cls: 'danger', fn: () => { state.history = []; save(); go('history'); } }]);
    else if (a === 'retrain') retrain();
    else if (a === 'testvoice') Speech.Voice.speak('Hello, I am Nova. Let us begin your mock interview.', { rate: state.settings.rate, voiceURI: state.settings.voice, lang: state.settings.lang });
  });
  document.addEventListener('input', (e) => {
    const t = e.target;
    if (t.id === 'nameIn') { state.name = t.value.trim(); save(); const h = $('.head h1'); if (h) h.textContent = `Hi, ${state.name || 'there'}! 👋`; renderRail(); }
    else if (t.id === 'customRole') { state.cfg.custom = t.value; save(); }
    else if (t.id === 'rate') { state.settings.rate = +t.value; $('#rateV').textContent = (+t.value).toFixed(1) + 'x'; save(); }
  });
  document.addEventListener('change', (e) => {
    const t = e.target;
    if (t.id === 'lang') { state.settings.lang = t.value; save(); }
    else if (t.id === 'voice') { state.settings.voice = t.value; save(); }
  });

  NS.UI = { state, $, $$, ic, esc, fmt, toast, modal, go, save, renderRail, sideTop, helpModal, load };
})();
</script>
<script>/* Live interview: question flow, camera, speech to text, spoken questions, transcript. */
(function () {
  const NS = (globalThis.IAI = globalThis.IAI || {});
  const U = NS.UI, { state, $, ic, esc, fmt, toast } = U;
  const { Listener, Voice, Media } = NS.Speech;
  const { Eval, buildInterview } = NS;

  let S = null, media = null, listener = null, timer = 0, raf = 0;
  const now = () => new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  const Q = () => S.questions[S.idx];
  const TYPE = { intro: 'Introduction', tech: 'Technical', behav: 'Behavioural' };

  function start() {
    const c = state.cfg;
    const { roleName, questions } = buildInterview(c.role, c.level, c.count, c.custom, Date.now());
    S = { name: state.name || 'there', roleKey: c.role, roleName, level: c.level, questions, idx: 0, answers: [], phase: 'idle', startedAt: Date.now(), ended: false, muted: false, token: 0, snapshot: null, msgs: [], ttsOn: state.settings.speak, typed: '', booted: false, hint: false, sttStarted: false };
    state.session = S;
    U.go('interview');
  }

  /* ---------- render ---------- */
  function render(v) {
    const lvl = NS.LEVELS[S.level].name;
    v.innerHTML = `<section class="view"><div class="col-main">
      <div class="head"><h1>Hi, ${esc(S.name)}! 👋</h1><p>${esc(S.roleName)} · ${lvl} | Live now</p></div>
      <div class="stage" id="stage">
        <div class="qcard"><div class="q-meta"><span class="tag" id="qNum"></span><span class="tag alt" id="qType"></span><span class="speaking" id="speaking"><span class="eq"><i></i><i></i><i></i><i></i></span>Nova is speaking</span></div><h2 class="q-text" id="qText"></h2></div>
        <div class="video" id="video"><video id="cam" playsinline muted></video>
          <div class="cam-off"><div class="big">${esc(S.name.charAt(0).toUpperCase())}</div><span>Camera is off. Your answers are still evaluated.</span></div>
          <span class="live"><i></i> Live</span><button class="fs" data-iv="fs" aria-label="Full screen">${ic('max')}</button>
          <div class="chip-status" id="status"><i></i><span id="statusT">Getting ready</span></div>
          <div class="vol"><div class="vol-track"><div class="vol-fill" id="vol"></div></div><button class="vol-btn" data-iv="tts" id="ttsBtn" aria-label="Toggle spoken questions"></button></div>
          <div class="controls"><button class="cbtn" data-iv="mic" id="micBtn" aria-label="Mute microphone"></button><button class="cbtn" data-iv="cam" id="camBtn" aria-label="Toggle camera"></button><button class="cbtn" data-iv="replay" aria-label="Repeat question">${ic('replay')}</button><button class="cbtn end" data-iv="end" aria-label="End interview">${ic('phone')}</button></div>
        </div>
      </div>
      <div class="actions" id="actions"></div>
      <div class="tiles" id="tiles"></div>
      <h3 class="sec">Live Insights <a data-iv="hint">Show hint</a></h3>
      <div class="ins" id="ins"></div>
    </div>
    <aside class="col-side">
      <div class="side-top"><div class="pill" id="sidePill"></div><button class="circle" data-iv="hint" title="Hint" aria-label="Hint">${ic('bulb')}</button></div>
      <div class="side-head"><h3>Transcript</h3><span class="link" style="text-decoration:none;color:var(--muted)" id="qCount"></span></div>
      <div class="chat" id="chat"></div>
      <form class="composer" id="composer" autocomplete="off"><input id="typeIn" placeholder="Or type your answer..." aria-label="Type your answer"><button type="submit" aria-label="Send">${ic('send')}</button></form>
      <div class="tip-card"><h3 id="tipT">Coach tip</h3><p id="tipP"></p><svg class="art" viewBox="0 0 100 80"><defs><linearGradient id="cr2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7db0ff"/><stop offset="1" stop-color="#2563eb"/></linearGradient></defs><path d="M8 66l-2-44 22 20 22-32 22 32 22-20-2 44z" fill="url(#cr2)"/><rect x="8" y="68" width="84" height="8" rx="3" fill="#1d4fd8"/><circle cx="6" cy="22" r="5" fill="#9cc2ff"/><circle cx="50" cy="8" r="5" fill="#9cc2ff"/><circle cx="94" cy="22" r="5" fill="#9cc2ff"/></svg></div>
    </aside></section>`;
    $('#composer').onsubmit = onType;
    refreshAll(); renderChat(); attachVideo();
    clearInterval(timer); timer = setInterval(tick, 300);
    cancelAnimationFrame(raf); meterLoop();
    if (!S.booted) boot();
    else if (S.suspended) { S.suspended = false; if (S.phase === 'asking' || S.phase === 'ready') askQuestion(true); else if (S.phase === 'listening' && S.sttStarted && !S.muted) listener.resume(); }
  }

  function suspend() {
    if (!S || S.ended) return;
    S.suspended = true; S.token++; Voice.stop(); listener && listener.pause();
    clearInterval(timer); cancelAnimationFrame(raf);
    if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  }

  async function boot() {
    S.booted = true;
    media = new Media();
    listener = new Listener(state.settings.lang, onLive, onSttError);
    let micOk = true;
    try { await media.startMic(); } catch (e) { micOk = false; }
    S.micOk = micOk;
    if (state.cfg.cam) { try { await media.startCam($('#cam')); } catch (e) { toast('Camera unavailable. Continuing without video.'); } }
    attachVideo(); refreshAll();
    if (!Listener.supported) toast('Speech recognition is not supported in this browser. Use Chrome or Edge, or type your answers.');
    else if (!micOk) toast('Microphone is blocked. Allow it in the address bar, or type your answers.');
    askQuestion();
  }

  function attachVideo() {
    const vid = $('#cam'), box = $('#video'); if (!vid || !box) return;
    if (media && media.vstream) { vid.srcObject = media.vstream; vid.play().catch(() => {}); box.classList.add('cam-on'); } else box.classList.remove('cam-on');
  }

  /* ---------- flow ---------- */
  async function askQuestion(silent) {
    const my = ++S.token, q = Q();
    S.phase = 'asking'; S.typed = ''; S.hint = false; S.sttStarted = false;
    if (!silent) addMsg({ kind: 'ai', text: q.q, label: `Question ${S.idx + 1}` });
    refreshAll();
    if (S.ttsOn && Voice.supported) {
      setSpeaking(true);
      await Voice.speak(q.q, { rate: state.settings.rate, voiceURI: state.settings.voice, lang: state.settings.lang });
      setSpeaking(false);
    }
    if (my !== S.token || S.ended || S.phase !== 'asking') return;
    if (state.settings.autoListen) enterListening(true); else { S.phase = 'ready'; refreshAll(); }
  }
  function enterListening(stt) {
    S.phase = 'listening'; S.listenStart = Date.now(); S.typed = ''; S.sttStarted = false;
    listener.reset(); listener.lang = state.settings.lang;
    if (stt && Listener.supported && !S.muted) { S.sttStarted = listener.start(); }
    refreshAll(); liveBubble('');
  }
  function onLive(finalText, interim) {
    if (!S || S.phase !== 'listening') return;
    liveBubble((finalText + ' ' + interim).trim());
  }
  function onSttError(err) {
    if (err === 'denied') toast('Microphone permission denied. Allow it or type your answer.');
    else if (err === 'network') toast('Speech service unreachable. Check your internet or type your answer.');
    else if (err === 'audio-capture') toast('No microphone found. Type your answer instead.');
  }

  async function submit(opts) {
    if (!S || S.phase !== 'listening') return;
    opts = opts || {};
    const endAt = Date.now(), q = Q(); S.phase = 'scoring'; refreshAll();
    let spoken = '';
    if (listener) spoken = opts.skip ? '' : await listener.finish();
    if (opts.skip && listener) listener.pause();
    const full = (spoken + ' ' + S.typed).trim();
    const fw = listener && listener.firstWordAt;
    const timing = { typed: !spoken && !!S.typed, speakSec: fw ? (endAt - fw) / 1000 : 0, thinkSec: fw ? (fw - S.listenStart) / 1000 : null };
    const an = Eval.analyze(full, q, timing, S.level);
    const sc = Eval.score(state.model.net, an.features, an.wc);
    const fb = Eval.feedback(an, sc, q);
    if (media && media.vstream) S.snapshot = media.snapshot($('#cam')) || S.snapshot;
    S.answers.push({ q: { q: q.q, topic: q.topic, type: q.type, model: q.model, modelLabel: q.modelLabel, kw: q.kw, hint: q.hint }, text: full, an, score: sc, fb, skipped: !!opts.skip, t0: (S.listenStart - S.startedAt) / 1000, dur: (endAt - S.listenStart) / 1000 });
    removeLive();
    addMsg({ kind: 'me', text: opts.skip ? 'Skipped this question.' : full || '(No speech was captured)' });
    if (state.settings.instant && !sc.skipped) addMsg({ kind: 'fb', sc, tip: fb.fix[0] || fb.good[0] || '' });
    else if (sc.skipped) addMsg({ kind: 'fb', sc, tip: fb.fix[0] });
    S.phase = 'review'; refreshAll();
  }
  function next() {
    if (S.phase !== 'review') return;
    if (S.idx + 1 >= S.questions.length) return finish();
    S.idx++; askQuestion();
  }
  function skip() {
    if (!['asking', 'ready', 'listening'].includes(S.phase)) return;
    S.token++; Voice.stop(); setSpeaking(false);
    if (S.phase !== 'listening') enterListening(false);
    submit({ skip: true });
  }
  function finish() {
    S.ended = true; S.endedAt = Date.now(); S.token++; Voice.stop(); listener && listener.pause();
    clearInterval(timer); cancelAnimationFrame(raf);
    if (media && media.vstream) S.snapshot = media.snapshot($('#cam')) || S.snapshot;
    media && media.stopAll($('#cam'));
    if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
    state.session = null; U.renderRail();
    if (!S.answers.length) { toast('Interview ended before any answer was recorded.'); return U.go('setup'); }
    const summary = Eval.summarize(S);
    const rec = { id: S.startedAt, ts: S.endedAt, name: S.name, roleName: S.roleName, roleKey: S.roleKey, level: S.level, summary, answers: S.answers, snapshot: S.snapshot, startedAt: S.startedAt, endedAt: S.endedAt };
    state.history.unshift(rec); state.history = state.history.slice(0, 12); U.save();
    NS.Report.show(rec);
  }

  /* ---------- controls ---------- */
  function onType(e) {
    e.preventDefault();
    const inp = $('#typeIn'), v = inp.value.trim(); if (!v) return;
    if (S.phase === 'asking' || S.phase === 'ready') { S.token++; Voice.stop(); setSpeaking(false); enterListening(false); }
    if (S.phase !== 'listening') return toast('Wait for the next question.');
    S.typed += (S.typed ? ' ' : '') + v; inp.value = '';
    submit();
  }
  async function replay() {
    if (S.phase === 'asking' || S.phase === 'ready') { Voice.stop(); return askQuestion(true); }
    if (S.phase !== 'listening') return;
    const was = S.sttStarted && !S.muted; listener.pause(); setSpeaking(true);
    await Voice.speak(Q().q, { rate: state.settings.rate, voiceURI: state.settings.voice, lang: state.settings.lang });
    setSpeaking(false); if (S.phase === 'listening' && was) listener.resume();
  }
  document.addEventListener('click', async (e) => {
    const b = e.target.closest('[data-iv]'); if (!b || !S || state.view !== 'interview') return;
    const a = b.dataset.iv;
    if (a === 'mic') {
      S.muted = !S.muted;
      if (S.phase === 'listening') { if (S.muted) listener.pause(); else { S.sttStarted = true; listener.resume(); } }
      refreshControls();
    } else if (a === 'cam') {
      if (media.vstream) media.stopCam($('#cam')); else { try { await media.startCam($('#cam')); } catch (err) { toast('Camera is blocked or unavailable.'); } }
      attachVideo(); refreshControls();
    } else if (a === 'tts') { S.ttsOn = !S.ttsOn; if (!S.ttsOn) Voice.stop(); refreshControls(); }
    else if (a === 'replay') replay();
    else if (a === 'fs') { const st = $('#stage'); try { document.fullscreenElement ? await document.exitFullscreen() : await st.requestFullscreen(); } catch (err) { toast('Full screen is not available here.'); } }
    else if (a === 'hint') { S.hint = !S.hint; refreshTip(); }
    else if (a === 'submit') submit();
    else if (a === 'redo') { listener.reset(); S.typed = ''; if (S.sttStarted && !S.muted) { listener.pause(); listener.resume(); } removeLive(); liveBubble(''); S.listenStart = Date.now(); toast('Answer cleared. Start again.'); }
    else if (a === 'start') enterListening(true);
    else if (a === 'next') next();
    else if (a === 'skip') skip();
    else if (a === 'skipvoice') { S.token++; Voice.stop(); setSpeaking(false); if (state.settings.autoListen) enterListening(true); else { S.phase = 'ready'; refreshAll(); } }
    else if (a === 'end') U.modal('<h3>End the interview?</h3><p>Answers you have already given will be scored and shown in your report.</p>', [{ label: 'Keep going' }, { label: 'End and see report', cls: 'primary', fn: finish }]);
  });

  /* ---------- refreshers ---------- */
  function refreshAll() { if (!$('#qText')) return; refreshQuestion(); refreshControls(); refreshTiles(); refreshTip(); refreshActions(); tick(); }
  function refreshQuestion() {
    const q = Q(); $('#qNum').textContent = `Question ${S.idx + 1} of ${S.questions.length}`;
    $('#qType').textContent = TYPE[q.type] || 'Technical'; $('#qText').textContent = q.q; $('#qCount').textContent = `${S.answers.length}/${S.questions.length} answered`;
  }
  function refreshControls() {
    const hasCam = !!(media && media.vstream);
    $('#micBtn').innerHTML = ic(S.muted ? 'micOff' : 'mic'); $('#micBtn').classList.toggle('off', S.muted);
    $('#camBtn').innerHTML = ic(hasCam ? 'video' : 'videoOff'); $('#camBtn').classList.toggle('off', !hasCam);
    $('#ttsBtn').innerHTML = ic(S.ttsOn ? 'vol' : 'volOff'); $('#ttsBtn').classList.toggle('off', !S.ttsOn);
  }
  function refreshActions() {
    const a = $('#actions'), p = S.phase, last = S.idx + 1 >= S.questions.length;
    const btn = (iv, cls, icon, t) => `<button class="btn ${cls} sm" data-iv="${iv}">${icon ? ic(icon) : ''}${t}</button>`;
    if (p === 'asking') a.innerHTML = `<span class="grow">Nova is asking the question...</span>${btn('skipvoice', 'ghost', 'skip', 'Skip voice')}`;
    else if (p === 'ready') a.innerHTML = `<span class="grow">Ready when you are.</span>${btn('skip', 'ghost', '', 'Skip question')}${btn('start', 'primary', 'mic', 'Start answering')}`;
    else if (p === 'listening') a.innerHTML = `<span class="grow">${Listener.supported ? 'Speak naturally, then press Submit when you are done.' : 'Type your answer on the right, then press Enter.'}</span>${btn('redo', 'ghost', 'replay', 'Re-record')}${btn('skip', 'ghost', '', 'Skip')}${btn('submit', 'primary', 'check', 'Submit answer')}`;
    else if (p === 'scoring') a.innerHTML = `<span class="grow">Scoring your answer with the neural network...</span>`;
    else a.innerHTML = `<span class="grow">Answer scored. Take a breath.</span>${btn('next', 'primary', 'arrowR', last ? 'Finish and view report' : 'Next question')}`;
  }
  function refreshTiles() {
    const n = S.questions.length, s = Math.max(0, Math.min(S.idx, n - 3)), shown = [s, s + 1, s + 2];
    const tile = (i) => { const done = i < S.answers.length, cur = i === S.idx && !done || (i === S.idx && S.phase !== 'review'); const cls = done ? 'done' : i === S.idx ? 'cur' : 'pend'; return `<div class="tile ${cls}"><div class="tc">${done ? ic('check') : 'Q' + (i + 1)}</div><div class="nm"><i></i>${esc((S.questions[i].topic || '').split(' ').slice(0, 2).join(' ') || 'Question')}</div></div>`; };
    $('#tiles').innerHTML = `<div class="tile ai" id="aiTile"><div class="tc">N</div><div class="nm"><i></i>Nova (AI)</div></div>${shown.map(tile).join('')}<div class="tile more">+${n - 3}</div>`;
  }
  function refreshTip() {
    const q = Q();
    if (S.hint) { $('#tipT').textContent = 'Hint'; $('#tipP').textContent = q.hint; }
    else { $('#tipT').textContent = 'Coach tip'; $('#tipP').textContent = q.type === 'behav' ? 'Use STAR: Situation, Task, Action, Result. End with what you learned.' : 'Aim for 45 to 90 seconds: define it, explain how it works, give an example.'; }
  }
  function setSpeaking(on) { const s = $('#speaking'), t = $('#aiTile'); s && s.classList.toggle('on', on); t && t.classList.toggle('speak', on); }
  function setStatus(cls, text) { const el = $('#status'); if (!el) return; el.className = 'chip-status ' + cls; $('#statusT').textContent = text; }

  function tick() {
    if (!S || !$('#sidePill')) return;
    $('#sidePill').innerHTML = `${ic('clock')}<span><b>${fmt((Date.now() - S.startedAt) / 1000)}</b> elapsed</span>`;
    const p = S.phase;
    if (p === 'listening') {
      const sec = (Date.now() - S.listenStart) / 1000;
      setStatus('listen', S.muted ? `Mic muted · ${fmt(sec)}` : Listener.supported ? `Listening · ${fmt(sec)}` : `Type your answer · ${fmt(sec)}`);
    } else if (p === 'asking') setStatus('', 'Nova is asking');
    else if (p === 'scoring') setStatus('', 'Scoring...');
    else if (p === 'review') setStatus('review', 'Answer scored');
    else setStatus('', p === 'ready' ? 'Ready' : 'Getting ready');
    insights();
  }
  function insights() {
    const el = $('#ins'); if (!el) return;
    let wc = 0, wpm = null, fill = 0, R = Eval.RANGES[Q().type || 'tech'];
    const last = S.answers[S.answers.length - 1];
    if (S.phase === 'listening') {
      const t = (listener.finalText + ' ' + listener.interim + ' ' + S.typed).trim();
      const an = Eval.analyze(t, Q(), { speakSec: listener.firstWordAt ? (Date.now() - listener.firstWordAt) / 1000 : 0 }, S.level);
      wc = an.wc; wpm = an.wpm; fill = an.fillerTotal;
    } else if (last && S.phase === 'review') { wc = last.an.wc; wpm = last.an.wpm; fill = last.an.fillerTotal; }
    const paceStatus = wpm == null ? ['Waiting', 'warn', 0] : wpm > 165 ? ['Too fast', 'warn', 60] : wpm < 100 ? ['A bit slow', 'warn', 60] : ['On track', 'good', 100];
    const lenPct = Math.min(100, Math.round(wc / R.words[0] * 100));
    const fStatus = fill <= 2 ? ['Clean', 'good'] : fill <= 4 ? ['Watch it', 'warn'] : ['High', 'bad'];
    const row = (icon, title, sub, c1, v1, c2, v2, pct, cls) => `<div class="ins-row"><div class="ii">${ic(icon)}</div><div><b>${title}</b><div class="sm">${sub}</div></div><div class="col">${c1} <em>${v1}</em></div><div class="col">${c2} <em>${v2}</em></div><div class="bar ${cls}"><i style="width:${pct}%"></i></div></div>`;
    el.innerHTML =
      row('clock', 'Speaking pace', wpm ? `${wpm} words per minute` : 'Starts when you speak', 'Ideal', '110-160', 'Status', paceStatus[0], paceStatus[2], paceStatus[1]) +
      row('msg', 'Answer length', `${wc} words so far`, 'Target', `${R.words[0]}-${R.words[1]}`, 'Progress', lenPct + '%', lenPct, lenPct >= 100 ? 'good' : '') +
      row('alert', 'Filler words', `${fill} so far`, 'Goal', 'under 3', 'Status', fStatus[0], Math.min(100, fill * 17), fStatus[1]);
  }

  /* ---------- chat ---------- */
  function msgHTML(m) {
    if (m.kind === 'ai') return `<div class="msg"><div class="av">N</div><div class="bub"><div class="who"><b>Nova · ${m.label}</b><span>${m.time}</span></div>${esc(m.text)}</div></div>`;
    if (m.kind === 'me') return `<div class="msg me"><div class="bub"><div class="who"><b>You</b><span>${m.time} ✓✓</span></div>${esc(m.text)}</div></div>`;
    const d = m.sc.dims, names = NS.ANN.OUTPUTS;
    return `<div class="msg"><div class="av">N</div><div class="bub"><div class="who"><b>Nova · Feedback</b><span>${m.time}</span></div><div class="chips"><span class="big">${m.sc.overall}/100</span>${d.map((v, i) => `<span>${names[i].slice(0, 7)} ${v}</span>`).join('')}</div>${m.tip ? `<ul><li>${esc(m.tip)}</li></ul>` : ''}</div></div>`;
  }
  function addMsg(m) { m.time = now(); S.msgs.push(m); renderChat(); }
  function renderChat() { const c = $('#chat'); if (!c) return; c.innerHTML = S.msgs.map(msgHTML).join(''); c.scrollTop = c.scrollHeight; }
  function liveBubble(text) {
    const c = $('#chat'); if (!c) return;
    let b = $('#liveBubble');
    if (!b) { c.insertAdjacentHTML('beforeend', `<div class="msg me" id="liveBubble"><div class="bub live"><div class="who"><b>You</b><span>speaking</span></div><span id="liveT"></span></div></div>`); b = $('#liveBubble'); }
    $('#liveT').textContent = text || (Listener.supported ? 'Listening...' : 'Type your answer below...');
    c.scrollTop = c.scrollHeight;
  }
  function removeLive() { const b = $('#liveBubble'); b && b.remove(); }

  function meterLoop() {
    const f = $('#vol'); if (!f) return;
    const v = media && media.stream && S.phase === 'listening' && !S.muted ? media.level() : 0;
    f.style.height = Math.max(4, Math.round(v * 92)) + '%';
    raf = requestAnimationFrame(meterLoop);
  }

  NS.Interview = { start, render, suspend };
})();
</script>
<script>/* Evaluation dashboard (styled after the second reference image). */
(function () {
  const NS = (globalThis.IAI = globalThis.IAI || {});
  const U = NS.UI, { state, $, ic, esc, fmt, toast } = U;
  const { ANN, LEVELS, Eval } = NS;
  let R = null, tab = 'overview', done = {}, accOpen = 0;

  function show(rec) {
    R = rec; tab = 'overview'; done = {}; accOpen = 0;
    document.body.classList.add('report-mode');
    $('#report').hidden = false; draw(); window.scrollTo({ top: 0 });
  }
  const avg = (a) => (a.length ? a.reduce((s, x) => s + x, 0) / a.length : 0);
  const TABS = [['overview', 'Overview'], ['answers', 'Answers'], ['delivery', 'Delivery'], ['ann', 'ANN insights']];

  function draw() {
    const s = R.summary, A = R.answers;
    const greet = s.overall >= 80 ? 'Outstanding work' : s.overall >= 65 ? 'Nice work' : s.overall >= 50 ? 'Good start' : 'Keep going';
    const order = s.dims.map((v, i) => [v, i]).sort((a, b) => b[0] - a[0]);
    const rank = {}; order.forEach(([, i], r) => (rank[i] = r));
    const pcls = ['k', 'c', 'h', 'o'];
    $('#report').innerHTML = `<div class="rpt">
      <header class="rpt-top"><button class="logo-pill" data-r="home">InterviewAI</button>
        <nav class="nav-pill">${TABS.map(([k, t]) => `<button class="${tab === k ? 'on' : ''}" data-tab="${k}">${t}</button>`).join('')}</nav>
        <button class="pill-btn" data-r="new">${ic('refresh')} New interview</button>
        <button class="circle-w" data-r="print" title="Print or save as PDF" aria-label="Print">${ic('download')}</button>
        <button class="circle-w" data-r="history" title="All reports" aria-label="Reports">${ic('user')}</button></header>
      <h1 class="rpt-h">${greet}, ${esc(R.name)}</h1>
      <div class="rpt-stats">
        <div class="pillbars">${ANN.OUTPUTS.map((n, i) => `<div class="pb" style="flex:${Math.max(8, s.dims[i])} 1 0"><span>${n}</span><div class="p ${pcls[i]}">${s.dims[i]}%</div></div>`).join('')}</div>
        <div class="bignums"><div><b>${s.overall}</b><span>Overall</span></div><div><b>${A.length}</b><span>Questions</span></div><div><b>${s.minutes}</b><span>Minutes</span></div></div>
      </div>
      <div id="tabBody">${tab === 'overview' ? overview(s, A, rank) : tab === 'answers' ? answers(A) : tab === 'delivery' ? delivery(s, A) : annTab(s, A)}</div>
      <p class="rpt-foot">Scores come from a neural network trained on a scoring rubric. Use them as practice guidance, not as a hiring verdict. ${esc(s.verdict)}.</p>
    </div>`;
  }

  /* ---------- overview ---------- */
  function overview(s, A, rank) {
    const lvl = LEVELS[R.level].name;
    const best = A.reduce((b, a, i) => (a.score.overall > A[b].score.overall ? i : b), 0);
    const circ = 2 * Math.PI * 60, ratio = s.avgWpm ? Math.min(s.avgWpm / 200, 1) : 0;
    const inZone = s.avgWpm && s.avgWpm >= 110 && s.avgWpm <= 160;
    const scls = (i) => ['c', 'k', 'g', 'l'][Math.min(3, rank[i])];
    const T = Math.max(1, (R.endedAt - R.startedAt) / 1000);
    const icons = ['target', 'mic', 'clock', 'msg', 'spark'];
    const doneN = Object.values(done).filter(Boolean).length;
    const missed = Object.entries(s.missedAll).sort((a, b) => b[1] - a[1]).slice(0, 8);
    const fills = Object.entries(s.fillers).sort((a, b) => b[1] - a[1]).slice(0, 6);
    const acc = [
      ['What went well', `<ul>${s.strengths.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>`],
      ['Focus areas', `<ul>${s.focus.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>`],
      ['Filler words', fills.length ? `<div class="tags">${fills.map(([k, v]) => `<span>${esc(k)} ×${v}</span>`).join('')}</div><p style="margin:8px 0 0">${s.fillerTotal} fillers in ${s.words} words. Hedges like "I think": ${s.hedgeTotal}.</p>` : '<p style="margin:0">None detected. Clean delivery.</p>'],
      ['Concepts to revise', missed.length ? `<div class="tags">${missed.map(([k, v]) => `<span>${esc(k)}</span>`).join('')}</div>` : '<p style="margin:0">You covered nearly every expected concept.</p>'],
    ];
    return `<div class="bento">
      <div class="g g-photo">${R.snapshot ? `<div class="ph" style="background-image:url(${R.snapshot})"></div>` : `<div class="ph init">${esc(R.name.charAt(0).toUpperCase())}</div>`}
        <div class="cap"><div><b>${esc(R.name)}</b><span>${esc(R.roleName)} · ${lvl}</span></div><div class="sc">${s.overall}/100</div></div></div>
      <div class="g g-bars"><h4>Score by question</h4><button class="arrow" data-tab="answers" aria-label="Open answers">${ic('arrowUR')}</button>
        <div class="big-thin">${s.overall}<small>avg</small></div>
        <div class="rbars">${A.map((a, i) => `<div class="bar-c ${i === best ? 'top' : ''}" data-goto="${i}" title="${esc(a.q.topic)}"><span class="tip">${a.score.overall}</span><div class="b" style="height:${Math.max(12, a.score.overall * 0.78)}px"></div><div class="dot"></div><span>Q${i + 1}</span></div>`).join('')}</div></div>
      <div class="g g-ring"><h4>Speaking pace</h4><button class="arrow" data-tab="delivery" aria-label="Open delivery">${ic('arrowUR')}</button>
        <div class="ring-wrap"><svg viewBox="0 0 160 160"><circle cx="80" cy="80" r="73" fill="none" stroke="rgba(0,0,0,.45)" stroke-width="1" stroke-dasharray="2 4"/><circle cx="80" cy="80" r="60" fill="none" stroke="rgba(255,255,255,.7)" stroke-width="9"/><circle cx="80" cy="80" r="60" fill="none" stroke="#58d9f8" stroke-width="9" stroke-linecap="round" stroke-dasharray="${(ratio * circ).toFixed(1)} ${circ.toFixed(1)}" transform="rotate(-90 80 80)"/></svg><div class="ring-c"><b>${s.avgWpm || '-'}</b><span>${s.avgWpm ? 'words / min' : 'typed answers'}</span></div></div>
        <div class="ring-btn"><span>Ideal 110 to 160</span><span>${s.avgWpm ? (inZone ? 'On target' : s.avgWpm > 160 ? 'Too fast' : 'Too slow') : 'No audio'}</span></div></div>
      <div class="g-side">
        <div class="g-skill"><div class="top"><h4 style="margin:0">Skills</h4><div class="big-thin">${s.overall}%</div></div>
          <div class="seg-bars">${s.dims.map((v, i) => `<div style="flex:${Math.max(18, v)} 1 0"><span class="t">${v}%</span><div class="s ${scls(i)}"><span>${ANN.OUTPUTS[i]}</span><b style="font-weight:400">${v}%</b></div></div>`).join('')}</div></div>
        <div class="g-plan"><div class="hd"><b>Action plan</b><span>${doneN}/${s.plan.length}</span></div>
          ${s.plan.map((p, i) => `<button class="todo ${done[i] ? 'done' : ''}" data-plan="${i}"><span class="ti">${ic(icons[i % 5])}</span><span class="tx">${esc(p.text)}</span><span class="ck">${ic('check')}</span></button>`).join('')}</div>
      </div>
      <div class="g g-acc">${acc.map(([t, b], i) => `<div class="acc-i ${accOpen === i ? 'open' : ''}"><button class="acc-h" data-acc="${i}"><span>${t}</span>${ic('chev')}</button><div class="acc-b">${b}</div></div>`).join('')}</div>
      <div class="g g-time"><div class="t-head"><span>Start</span><b>Interview timeline</b><span>${fmt(T)}</span></div>
        <div class="t-grid"><div class="t-inner"><div class="t-axis">${[0, 1, 2, 3, 4].map((i) => `<i><b>${fmt(T * i / 4)}</b></i>`).join('')}</div>
          ${A.map((a, i) => { const l = Math.min(100, a.t0 / T * 100), w = Math.max(2, a.dur / T * 100); return `<div class="t-row"><div class="t-ev ${a.score.overall >= 70 ? 'hi' : ''}" data-goto="${i}" style="left:min(${l.toFixed(1)}%,calc(100% - 190px));width:max(${w.toFixed(1)}%,190px)"><div><b>Q${i + 1} · ${esc(a.q.topic)}</b><small>Score ${a.score.overall} · ${fmt(a.dur)}</small></div><div class="mini"><i>${a.score.overall >= 70 ? '✓' : '!'}</i><i>${a.an.matched.length}</i></div></div></div>`; }).join('')}</div></div></div>
    </div>`;
  }

  /* ---------- answers ---------- */
  function answers(A) {
    return A.map((a, i) => {
      const d = a.score.dims, mx = Math.max(...d), n = ANN.OUTPUTS;
      const an = a.an;
      const hits = an.matched.map((k) => `<span>✓ ${esc(k)}</span>`).join('') + an.missed.map((k) => `<span style="opacity:.5">+ ${esc(k)}</span>`).join('');
      return `<article class="ans" id="ans-${i}">
        <div class="ans-h"><div><div class="qn">Question ${i + 1} · ${esc(a.q.topic)}</div><h3>${esc(a.q.q)}</h3></div><div class="ans-score"><div class="big">${a.score.overall}</div></div></div>
        <div class="dims4">${d.map((v, k) => `<div class="dim ${v === mx ? 'best' : ''}">${n[k]}<b>${v}</b><div class="mb"><i style="width:${v}%"></i></div></div>`).join('')}</div>
        <div class="said">${a.text ? Eval.highlight(an) : '<em>No answer was captured for this question.</em>'}</div>
        <div class="legend"><span><i style="background:#c8f1de"></i>Expected concept</span><span><i style="background:#ffd9a8"></i>Filler word</span><span><i style="background:#e5d9ff"></i>Hedge</span></div>
        <div class="metrics"><span>${an.wc} words</span><span>${an.typed ? 'typed answer' : an.wpm ? an.wpm + ' wpm' : 'pace n/a'}</span>${an.thinkSec != null ? `<span>started after ${an.thinkSec}s</span>` : ''}<span>${an.fillerTotal} fillers</span><span>${an.matched.length}/${a.q.kw.length} concepts</span></div>
        <div class="tags" style="margin-top:12px">${hits}</div>
        <div class="two"><div><h5>What went well</h5>${a.fb.good.length ? `<ul>${a.fb.good.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>` : '<p style="margin:0">Nothing stood out yet. Focus on the fixes.</p>'}</div><div><h5>To improve</h5>${a.fb.fix.length ? `<ul>${a.fb.fix.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>` : '<p style="margin:0">Great answer. Keep this up.</p>'}</div></div>
        <details><summary>${esc(a.q.modelLabel || 'Model answer')}</summary><p style="margin:10px 0 0">${esc(a.q.model)}</p></details>
        <details><summary>What the neural network saw</summary>${ANN.FEATURES.map((f, k) => `<div class="frow"><span title="${esc(f.hint)}">${f.label}</span><div class="tr"><i style="width:${Math.round(an.features[k] * 100)}%"></i></div><span>${Math.round(an.features[k] * 100)}</span></div>`).join('')}</details>
      </article>`;
    }).join('');
  }

  /* ---------- delivery ---------- */
  function delivery(s, A) {
    const think = A.filter((a) => a.an.thinkSec != null);
    const tAvg = think.length ? Math.round(avg(think.map((a) => a.an.thinkSec))) : null;
    const tips = [];
    if (s.avgWpm && s.avgWpm > 160) tips.push('Slow down. Pause for a full second after each key point.');
    if (s.avgWpm && s.avgWpm < 110) tips.push('Pick up the pace a little. Practise answering out loud with a timer.');
    if (s.fillerTotal / Math.max(1, s.words) > 0.03) tips.push('Replace filler words with a silent pause. Pauses sound confident.');
    if (tAvg != null && tAvg > 8) tips.push('You took a while to start. It is fine to say "Let me structure my thoughts" and then begin.');
    if (!tips.length) tips.push('Your delivery is solid. Keep practising under time pressure.');
    return `<div class="tiles4">
      <div class="g"><h4>Average pace</h4><div class="big-thin">${s.avgWpm || '-'}<small>wpm</small></div></div>
      <div class="g"><h4>Words spoken</h4><div class="big-thin">${s.words}</div></div>
      <div class="g"><h4>Filler words</h4><div class="big-thin">${s.fillerTotal}</div></div>
      <div class="g"><h4>Average start delay</h4><div class="big-thin">${tAvg != null ? tAvg : '-'}<small>sec</small></div></div></div>
      <div class="g" style="margin-top:14px"><h4>Per answer</h4><table class="dl"><thead><tr><th>Question</th><th>Pace (ideal zone shaded)</th><th>Speaking</th><th>Start delay</th><th>Fillers</th><th>Hedges</th></tr></thead><tbody>
      ${A.map((a, i) => `<tr><td>Q${i + 1}</td><td>${a.an.wpm ? `<div class="pace-bar"><div class="zone" style="left:${110 / 2.2}%;width:${50 / 2.2}%"></div><i style="left:${Math.min(100, a.an.wpm / 2.2)}%"></i></div><small>${a.an.wpm} wpm</small>` : a.an.typed ? 'typed' : 'n/a'}</td><td>${a.an.speakSec ? fmt(a.an.speakSec) : '-'}</td><td>${a.an.thinkSec != null ? a.an.thinkSec + 's' : '-'}</td><td>${a.an.fillerTotal}</td><td>${a.an.hedgeTotal}</td></tr>`).join('')}</tbody></table></div>
      <div class="g" style="margin-top:14px"><h4>How to improve your delivery</h4><ul style="margin:8px 0 0;padding-left:18px;line-height:1.7;font-weight:300">${tips.map((t) => `<li>${esc(t)}</li>`).join('')}</ul></div>`;
  }

  /* ---------- ANN ---------- */
  function annTab(s, A) {
    const F = ANN.FEATURES.map((f, k) => ({ f, v: avg(A.map((a) => a.an.features[k])) }));
    return `<div class="g" style="margin-top:14px"><h4>What the neural network noticed</h4>
      <p class="tabs-intro">Every answer is turned into 13 numbers between 0 and 1. A 13 to 16 to 8 to 4 neural network then predicts your Content, Structure, Clarity and Delivery scores. These are your averages across the interview.</p>
      ${F.map(({ f, v }, k) => `<div class="frow"><span title="${esc(f.hint)}">${f.label}${k === 5 || k === 8 ? ' (lower is better)' : ''}</span><div class="tr"><i style="width:${Math.round(v * 100)}%"></i></div><span>${Math.round(v * 100)}</span></div>`).join('')}
      <div style="margin-top:20px"><button class="pill-btn" data-r="lab" style="background:#1b1b1d;color:#fff">${ic('network')} Open the ANN Lab</button></div></div>`;
  }

  /* ---------- events ---------- */
  document.addEventListener('click', (e) => {
    if ($('#report').hidden) return;
    const t = e.target, T = t.closest('[data-tab]');
    if (T) { tab = T.dataset.tab; draw(); return window.scrollTo({ top: 0, behavior: 'smooth' }); }
    const G = t.closest('[data-goto]');
    if (G) { tab = 'answers'; draw(); const el = $('#ans-' + G.dataset.goto); el && el.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
    const P = t.closest('[data-plan]'); if (P) { done[P.dataset.plan] = !done[P.dataset.plan]; draw(); return; }
    const A = t.closest('[data-acc]'); if (A) { accOpen = accOpen === +A.dataset.acc ? -1 : +A.dataset.acc; draw(); return; }
    const B = t.closest('[data-r]'); if (!B) return;
    const r = B.dataset.r;
    if (r === 'home' || r === 'new') U.go('setup');
    else if (r === 'history') U.go('history');
    else if (r === 'lab') U.go('ann');
    else if (r === 'print') { try { window.print(); } catch (err) { toast("Use your browser's Print menu to save as PDF."); } }
  });

  NS.Report = { show };
})();
</script>
<script>(function () {
  const NS = globalThis.IAI, U = NS.UI, { state } = U;
  U.load();
  U.go('setup');
  // Train the neural network in the background (about one second).
  NS.ANN.trainModel({ epochs: 45, yieldEvery: 3 }).then((m) => {
    state.model = m; state.modelBusy = false;
    if (state.view === 'setup') { const y = window.scrollY; U.go('setup'); window.scrollTo({ top: y }); }
    else if (state.view === 'ann') U.go('ann');
    else { const p = U.$('#sidePill'); if (p && state.view !== 'interview') p.innerHTML = `<span><b>ANN ready</b></span>`; }
  });
})();
</script>
</body>
</html>
